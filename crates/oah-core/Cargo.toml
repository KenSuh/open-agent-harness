[package]
name = "oah-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
caseless = "=0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = { version = "=0.11.0", default-features = false }
sha2 = "0.11.1"
toml_edit = { version = "=0.22.27", default-features = false, features = ["parse"] }
unicode-general-category = "=0.5.1"
unicode-normalization = "=0.1.21"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "platform-verifier"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[target."cfg(windows)".dependencies]
junction = "2.1.0"
winapi-util = "0.1.11"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3.27.0"
