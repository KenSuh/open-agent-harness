# Items of EVIDENCE-MATRIX.md still open for the entries above, with what settles each.
[open]
U-1 = "Gemini CLI install locations beyond PATH and a non-interactive sign-in status: gemini --help, the authentication doc"
U-4 = "Copilot CLI sign-in status command and exit code: copilot help, run signed in and signed out"
U-7a = "OpenCode sign-in status command; Windows install, config and skills paths: opencode --help, opencode debug paths"
U-7c = "OpenCode plugin hook events that add context at prompt time: the plugin API reference"
U-8a = "Antigravity app bundle paths and sign-in status command: read the bundle id and path, agy --help"
U-8b = "Antigravity settings key of the default model and thinking level: settings reference, diff after /model"
U-8c = "Antigravity PreInvocation payload and injectSteps: a test hook in a temporary config folder"
U-9 = "Cursor bundle and executable paths, IDE sign-in probe, per-skill disable setting: install on both systems"
U-10 = "Symlinked skill folders outside Claude Code and Codex, and Windows junctions: an evidence session per agent"
U-11a = "Claude Code skillOverrides at user level and for plugin skill names: an evidence session in a temporary profile"
U-12c = "Codex plugin update and remove commands: the CLI's help"
U-20 = "Pack update and hold behaviour per agent: an evidence session with a test pack in a temporary config folder"
U-22 = "When each agent reads its model setting: the reload check of section 7.5 as an evidence session"
N-7 = "A command name shared by unrelated tools: confirm the Cursor CLI's identity before recording it"
