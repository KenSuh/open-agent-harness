# Agent facts (CONTRACTS C8, DECISIONS D-07). The one place a fact about an agent is written.
#
# One entry per (agent, capability):
#   status       verified | unknown | none
#   basis        carried (pinned by a v0.4.0 fixture) | docs (a cited source) | measured (observed, with version)
#   source       where the fact comes from; [Sn] are the sources of DESIGN-C2 section 13
#   os           systems the basis covers; any other system reads as unknown (empty for unknown entries)
#   verified_on  the agent version a measurement saw; empty for carried and docs
#   unverified   [open] items that must settle before the entry can be verified
#
# A write-bearing capability (skills_link, native_switch, model_write, model_read, hook_prompt, pack_update)
# with basis docs reads as unknown at run time: docs do not stand in for a measurement. Every Windows fact
# starts unknown unless a v0.4.0 fixture carries it; the Windows machine is offline. A first measurement of a
# write-bearing capability comes from an owner-attended evidence session (D-30), never from this slice.

