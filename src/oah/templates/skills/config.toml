# Skill selection and the optional AI re-ranker. `oah init` may copy this into .oah/config.toml.

[skills]
# "reference" names each selected skill and its path in the brief; "attach" also pastes its text.
mode = "reference"
# A local log of each selection in oah's state folder. Nothing is sent anywhere.
telemetry = true
# Skills never to select, by name (for example "unlazy") or plugin:name.
exclude = []
# Rules added to the built-in ones. An empty list means "any".
extra_rules = []
# [[skills.extra_rules]]
# skill = "systematic-debugging"
# kinds = ["docs"]          # task kinds, such as implementation, review, docs
# stages = []               # initial, review, correction
# risks = []                # low, normal, high, critical
# file_kinds = []           # python, react, markdown, sql, ...
# reason = "why this skill fits"

[rerank]
# Off until you turn it on. A key alone never turns it on.
# When on, re-ranking sends the task kind, the query, and each candidate's name and description
# (up to 200 characters). For difficulty advice, oah sends the four axes (kind, intensity,
# reasoning, risk), the Intent sections or the request text, plus Scope paths, up to 16,000 characters
# in all, after the privacy rules. Secret-shaped text is not sent; never code, diffs or stored values.
# Jev sets the tier, never below the floor tier.
# The provider may charge for either request type. Enable only if you consent to both.
enabled = false
provider = ""               # "typesafe" for TypeSafe Jev
timeout_seconds = 10.0
# After this many timeout, network, 429 or 529 failures in a row, Jev is not asked for
# circuit_open_seconds; after that, one request decides whether it is asked again.
circuit_failures = 5
circuit_open_seconds = 600
max_requests_per_day = 0    # Jev requests per UTC day; 0 means no limit

[rerank.typesafe]
model = "jev-latest"
# The key is read at runtime from ${TYPESAFE_API_KEY}, or from the OS keychain under service "oah"
# and this name. Never write the key itself in this file.
key_name = "TYPESAFE_API_KEY"
