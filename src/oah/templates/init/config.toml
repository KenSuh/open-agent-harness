# oah project settings, written by `oah init`. Edit freely: `oah init` never replaces this file
# without --force. A key you leave out uses oah's built-in default.

# Which engine does each stage: Claude Code implements first; Codex reviews, corrects and re-reviews.
[stages]
initial = "claude"
review = "codex"
correction = "codex"

# How benchmark scores pick the model inside each engine. "balanced" takes the cheapest model that reaches what
# the difficulty asks, "performance" asks one step more, and "efficient" takes the most score per cost, from
# one step lower up.
[models]
profile = "balanced"
# When oah rebuilds its list of models (after a CLI update, or once ttl_hours, 24 by default, have passed), it
# downloads fresh public scores: Epoch AI's benchmark file from epoch.ai and, only if you stored your own
# ARTIFICIAL_ANALYSIS_API_KEY, Artificial Analysis's model list from artificialanalysis.ai with that key. A request
# carries oah's name and version and nothing about you, your project or your tasks; the scores stay on this machine.
# false: no request, and the scores shipped with oah choose.
fetch_scores = true

[engines.claude]
command = ["claude"]
# Empty: benchmark scores choose, so new models arrive without edits here. List models, strongest first,
# to rank them yourself instead.
quality_order = []
# When the re-ranker ([rerank], Jev) is on, it picks each call's model and effort from the models the
# CLI lists, never below the floor the task kind needs. Empty allows every listed model; name models
# to allow only those. This list only filters: it never makes a model qualified for a tier.
allowed_models = []

# The highest effort any call may use for a model, one line each, such as "<model>" = "high".
# Empty: no cap. Clamps to a supported effort are recorded, including for model pins and without Jev.
# A cap below the model's own floor effort skips that model; raise or remove the cap to include it.
# An unrunnable model pin refuses with OAH_CONFIG_INVALID.
# The efficient profile passes over such a model instead.
[engines.claude.effort_caps]

# The models you have checked for a tier, one line per tier, such as high = ["<model>", "<model>"]. That
# tier runs the first one the CLI lists, ahead of quality_order and scores. When Jev is on, a call may
# use a model only when it is in the pool of its floor tier and of its own tier; models in one pool are
# equals. Empty: scores choose.
[engines.claude.tier_pools]

# Difficulty tiers: model = "" lets scores choose, or follows quality_order when it lists models (low
# takes the last, medium the second, high and max the first); a model name pins that tier.
[engines.claude.tiers]
low = { model = "", effort = "low", timeout_min = 15 }
medium = { model = "", effort = "medium", timeout_min = 30 }
high = { model = "", effort = "high", timeout_min = 60 }
max = { model = "", effort = "max", timeout_min = 90 }

[engines.codex]
command = ["codex"]
# Empty: benchmark scores choose, so new models arrive without edits here. List models, strongest first,
# to rank them yourself instead.
quality_order = []
# When the re-ranker ([rerank], Jev) is on, it picks each call's model and effort from the models the
# CLI lists, never below the floor the task kind needs. Empty allows every listed model; name models
# to allow only those. This list only filters: it never makes a model qualified for a tier.
allowed_models = []

# The highest effort any call may use for a model, one line each, such as "<model>" = "high".
# Empty: no cap. Clamps to a supported effort are recorded, including for model pins and without Jev.
# A cap below the model's own floor effort skips that model; raise or remove the cap to include it.
# An unrunnable model pin refuses with OAH_CONFIG_INVALID.
# The efficient profile passes over such a model instead.
[engines.codex.effort_caps]

# The models you have checked for a tier, one line per tier, such as high = ["<model>", "<model>"]. That
# tier runs the first one the CLI lists, ahead of quality_order and scores. When Jev is on, a call may
# use a model only when it is in the pool of its floor tier and of its own tier; models in one pool are
# equals. Empty: scores choose.
[engines.codex.tier_pools]

# "highest" is the highest reasoning effort the resolved model supports.
[engines.codex.tiers]
low = { model = "", effort = "low", timeout_min = 15 }
medium = { model = "", effort = "medium", timeout_min = 30 }
high = { model = "", effort = "high", timeout_min = 60 }
max = { model = "", effort = "highest", timeout_min = 90 }

[preflight]
# The branch work lands on ({{BRANCH_HOW}}). Change it if your default branch has another name.
default_branch = {{DEFAULT_BRANCH}}

[skills]
# Keep oah's own skill cache (in its state folder) current, checked at most once per interval.
# Your project's skill folders never change on their own: `oah skills update --project` does that.
auto_update = {{AUTO_UPDATE}}
update_interval_days = 1
{{RERANK}}
