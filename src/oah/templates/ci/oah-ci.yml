# Written by `oah ci init`. Edit it freely; `oah ci init` shows a diff before it changes this file again.
# It tests this project on every push and pull request, and scans the full git history for leaked keys.
# It reads no keys and changes no repository settings.
name: oah-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: oah-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [@@RUNNERS@@]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # bash runs on every GitHub-hosted runner, Windows included (Git Bash).
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

@@SETUP_STEPS@@
@@TEST_STEPS@@
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The full history, so a key that was committed and later deleted is still found.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks (MIT) from its GitHub release, pinned by version and by the SHA-256 of the archive.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # --redact keeps the found value itself out of the log; any finding fails the job.
      - name: Scan the full history for leaked keys
        run: gitleaks detect --source . --redact --verbose
