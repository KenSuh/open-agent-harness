name: Feature request
description: Propose a new capability or a change to how oah works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For a large change, agree on the approach here before you write code. Questions belong in Discussions.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should oah do? Include the commands or output you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: cost
    attributes:
      label: Cost to users
      description: What would the change cost users, for example a new prompt, a stricter refusal or a new dependency?
