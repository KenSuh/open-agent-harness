name: ci

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # What runs when: a pull request runs only the test modules its changes can affect, on 1 to 6 shards per OS (about
  # 30 minutes of measured time each); a pull request that affects no test still runs shard 1 with no tests, so the
  # install, version, privacy and installer checks below always run. A manual run, a change to shared test
  # infrastructure (tests/helpers.py, tests/__init__.py, this folder, the shard tools, pyproject.toml, ...) or any
  # non-Python file under src/ or a failure of the selector runs the whole suite on 6 shards per OS.
  # The select job decides once and gives every shard the same modules and count.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.affected.outcome == 'success' && steps.affected.outputs.modules && steps.affected.outputs.count || 6 }}
      shards: ${{ steps.affected.outcome == 'success' && steps.affected.outputs.modules && steps.affected.outputs.shards || '[1, 2, 3, 4, 5, 6]' }}
      modules: ${{ steps.affected.outcome == 'success' && steps.affected.outputs.modules || 'ALL' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # A failed step's outputs, even partial ones, are ignored; no plan means the whole suite on 6 shards.
      - name: Select affected tests
        id: affected
        continue-on-error: true
        env:
          OAH_EVENT: ${{ github.event_name }}
          OAH_BASE: ${{ github.event.pull_request.base.sha }}
          OAH_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/affected_tests.py --event "$OAH_EVENT" --base "$OAH_BASE" --head "$OAH_HEAD" --summary --github-output "$GITHUB_OUTPUT"

  test:
    needs: select
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/${{ needs.select.outputs.count || 6 }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # tools/test_shard.py splits the selected tests by test method, balanced by the measured times in
        # tools/test_shard_times.json, so the methods of one class land apart and no single class can outgrow a shard.
        shard: ${{ fromJSON(needs.select.outputs.shards || '[1, 2, 3, 4, 5, 6]') }}
    runs-on: ${{ matrix.os }}
    # Shards are balanced by measured time; tools/shard_times.py refreshes the data from saved job logs. The limit
    # is 60 minutes on Windows and 45 on macOS: for a slow shard, the balanced split with fresh data comes first.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 45 }}
    steps:
      # Test the PR head itself; GitHub's temporary merge commit carries an identity we do not control.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Readable failure output on Windows; UTF-8 mode stays off so missing encodings still fail.
      # With no affected tests this shard runs zero tests, says "no affected tests" and passes.
      - name: Unit tests
        env:
          OAH_REQUIRE_NODE_TESTS: "1"
          PYTHONIOENCODING: "utf-8:backslashreplace"
          OAH_TEST_MODULES: ${{ needs.select.outputs.modules || 'ALL' }}
        run: python tools/test_shard.py ${{ matrix.shard }} ${{ needs.select.outputs.count || 6 }} --modules-env OAH_TEST_MODULES -v

      # The packaging, privacy and installer checks run once per OS, in the first shard.
      # One command per step: a multi-line PowerShell step only fails on its last command.
      - name: Install the package
        if: matrix.shard == 1
        run: python -m pip install .

      - name: Console script
        if: matrix.shard == 1
        run: oah --version

      - name: python -m oah
        if: matrix.shard == 1
        run: python -m oah --version

      - name: Privacy scan
        if: matrix.shard == 1
        run: python tools/privacy_scan.py --gitleaks off

      # Installer dry runs: print every step, install nothing. /bin/bash is the bash 3.2 macOS ships.
      - name: Installer dry run (bash 3.2)
        if: runner.os == 'macOS' && matrix.shard == 1
        run: /bin/bash install/install.sh --dry-run

      - name: Installer dry run (Windows PowerShell 5.1)
        if: runner.os == 'Windows' && matrix.shard == 1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\install\install.ps1 -DryRun

      - name: Installer dry run (PowerShell 7)
        if: runner.os == 'Windows' && matrix.shard == 1
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\install\install.ps1 -DryRun
