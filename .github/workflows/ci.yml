name: ci

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Test the PR head itself; GitHub's temporary merge commit carries an identity we do not control.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Readable failure output on Windows; UTF-8 mode stays off so missing encodings still fail.
      - name: Unit tests
        env:
          OAH_REQUIRE_NODE_TESTS: "1"
          PYTHONIOENCODING: "utf-8:backslashreplace"
        run: python -m unittest discover -s tests -t . -v

      # One command per step: a multi-line PowerShell step only fails on its last command.
      - name: Install the package
        run: python -m pip install .

      - name: Console script
        run: oah --version

      - name: python -m oah
        run: python -m oah --version

      - name: Privacy scan
        run: python tools/privacy_scan.py --gitleaks off

      # Installer dry runs: print every step, install nothing. /bin/bash is the bash 3.2 macOS ships.
      - name: Installer dry run (bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash install/install.sh --dry-run

      - name: Installer dry run (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\install\install.ps1 -DryRun

      - name: Installer dry run (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\install\install.ps1 -DryRun
