name: secrets-push

# Hard rule A17: every push (branches and tags) and every manual run gets the same secret scan as a pull request.
# The scan job lives in secrets.yml; this entry point only calls it, so its check is reported as
# "push secret scan / secret scan" and never as a second run of the pull request "secret scan" check.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the older scan, as before. The key differs from the one secrets.yml
# evaluates for the called job, so caller and called workflow never wait on each other.
concurrency:
  group: secrets-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-scan:
    name: push secret scan
    uses: ./.github/workflows/secrets.yml
