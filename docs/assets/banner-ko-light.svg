      #banner-ko-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #banner-ko-light-root .display { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", "Arial Black", "Segoe UI Black", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 60px; font-weight: 800; }
      #banner-ko-light-root .brand { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", "Arial Black", "Segoe UI Black", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 24px; font-weight: 800; }
      #banner-ko-light-root .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 18px; font-weight: 600; }
      #banner-ko-light-root .tag { font-size: 19px; font-weight: 600; }
