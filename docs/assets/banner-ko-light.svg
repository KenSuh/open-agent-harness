<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="736" viewBox="0 0 1200 736" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">open-agent-harness</title>
<desc id="desc">open-agent-harness. Claude Code와 Codex CLI가 내 저장소에서 한 팀처럼 일한다. Claude Code가 1차 구현을 하고, Codex CLI가 리뷰가 수렴할 때까지 리뷰하고 고치며, 작업은 사용자가 확인한 뒤 반영된다. 켜서 쓰는 판정기 TypeSafe Jev가 난이도, 모델 선택, 순서를 판정한다. 리뷰는 수렴하면 끝나고, 결정이 필요하면 멈춰서 묻는다. 라운드 상한은 선택이다. 리스, 게이트, 영향 지도, 위키가 작업을 받친다.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient>
<linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="1000" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="0.5" stop-color="#6639ba"/><stop offset="1" stop-color="#0969da"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#d8dee4"/></pattern>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.10"/></filter>
<filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif; text-anchor: middle; }
.title { font-size: 76px; font-weight: 800; fill: url(#ink); letter-spacing: -1px; }
.pitch { font-size: 34px; fill: #424a53; }
.jev { font-size: 34px; font-weight: 700; fill: #1f2328; }
.jevhint { font-size: 34px; fill: #424a53; }
.name { font-size: 34px; font-weight: 700; fill: #1f2328; }
.hint { font-size: 34px; fill: #424a53; }
.done { font-size: 34px; font-weight: 700; fill: #116329; }
.rail { font-size: 34px; font-weight: 600; fill: #424a53; }
.dot { animation: travel 8s ease-in-out infinite both; }
.halo-claude { animation: glow-claude 8s ease-in-out infinite both; }
.halo-codex { animation: glow-codex 8s ease-in-out infinite both; }
.halo-land { animation: glow-land 8s ease-in-out infinite both; }
.ring { transform-box: fill-box; transform-origin: center; animation: spin 8s ease-in-out infinite both; }
.settle { animation: settle 8s ease-in-out infinite both; }
.judge-link { animation: drift 6s linear infinite both; }
@keyframes travel {
  0% { transform: translate(314px, 460px); opacity: 0; }
  3% { transform: translate(314px, 460px); opacity: 1; }
  12% { transform: translate(362px, 460px); opacity: 1; }
  15% { transform: translate(362px, 460px); opacity: 0; }
  60% { transform: translate(726px, 460px); opacity: 0; }
  63% { transform: translate(726px, 460px); opacity: 1; }
  72% { transform: translate(774px, 460px); opacity: 1; }
  75%, 100% { transform: translate(774px, 460px); opacity: 0; }
}
@keyframes glow-claude { 0%, 100% { opacity: 0; } 5% { opacity: 0.5; } 14% { opacity: 0; } }
@keyframes glow-codex { 0%, 16%, 60%, 100% { opacity: 0; } 22%, 52% { opacity: 0.5; } }
@keyframes glow-land { 0%, 72%, 92%, 100% { opacity: 0; } 78% { opacity: 0.5; } }
@keyframes spin { 0%, 16% { transform: rotate(0deg); } 56%, 100% { transform: rotate(720deg); } }
@keyframes settle { 0%, 8%, 62%, 100% { opacity: 1; } 14%, 56% { opacity: 0; } }
@keyframes drift { to { stroke-dashoffset: -22; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
