<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banner-ko-light-title banner-ko-light-desc" id="banner-ko-light-root">
<title id="banner-ko-light-title">open-agent-harness</title>
<desc id="banner-ko-light-desc">open-agent-harness 배너는 “그냥 묻고, 확인만 하면 돼.”라는 제목과 AI가 난이도·모델 선택·위키·영향 지도·리뷰 사이클 등을 챙기며 전문가처럼 프로그램을 만들고 고치고 사용자는 묻고 판단이 필요할 때 답하고 확인한다는 설명을 보여 주며, 주황빛 사각형 캐릭터는 “Claude Code — 만든다”, 초록 원형 캐릭터는 “Codex CLI — 검토하고 고친다”, 보라 육각형 캐릭터는 “TypeSafe Jev — 권장 선택형 판정”으로 표시되고, “작업 완료 · 확인 기다리는 중”인 oah 채팅은 “로그인 기능 다 됐어?”에 완료를 알리며 영향 지도로 변경이 닿는 곳 확인, 리스로 바꿀 파일 예약, Jev의 난이도 판정과 모델 자동 선택, Claude Code의 구현, Codex CLI의 검토·수정 수렴, 게이트 4개 통과와 증거 보관, 위키에 이유 기록을 체크한 뒤 “반영할까?”라고 묻고 “반영해 줘”와 “게이트 보여 줘” 선택 칩을 보여 준다.</desc>
<defs>
