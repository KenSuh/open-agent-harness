<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-start-dark-title loop-start-dark-desc" id="loop-start-dark-root">
<title id="loop-start-dark-title">Prepare and implement</title>
<desc id="loop-start-dark-desc">You describe and claim the task, oah routes it to Claude Code, and you record the implementation evidence before review.</desc>
<defs>
      <style>#loop-start-dark-root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
      #loop-start-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #loop-start-dark-root .title { font-size: 28px; font-weight: 600; }
      #loop-start-dark-root .group { font-size: 14px; font-weight: 600; }
      #loop-start-dark-root .node { font-size: 12px; font-weight: 600; }
      #loop-start-dark-root .label { font-size: 12px; font-weight: 400; }
      #loop-start-dark-root .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; }
      #loop-start-dark-root .arrow-label { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 400; }
      @media print {
#loop-start-dark-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="loop-start-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
</marker>
<marker id="loop-start-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
</marker>
<marker id="loop-start-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
</marker>
</defs>
<rect x="0" y="0" width="720" height="504" rx="0" fill="#0d1117"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#f0f6fc">Prepare and implement</text>
<line x1="100" y1="144" x2="100" y2="420" stroke="#8b949e" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="300" y1="144" x2="300" y2="420" stroke="#8b949e" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="620" y1="144" x2="620" y2="420" stroke="#8b949e" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="100" y1="200" x2="300" y2="200" stroke="#8b949e" stroke-width="1" marker-end="url(#loop-start-dark-arrow)"/>
<rect x="164" y="172" width="72" height="20" rx="2" fill="#0d1117"/>
<text x="200.0" y="187" class="arrow-label" text-anchor="middle" fill="#c9d1d9">1. TASK</text>
<line x1="300" y1="240" x2="100" y2="240" stroke="#8b949e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#loop-start-dark-arrow)"/>
<rect x="162" y="212" width="76" height="20" rx="2" fill="#0d1117"/>
<text x="200.0" y="227" class="arrow-label" text-anchor="middle" fill="#c9d1d9">2. ROUTE</text>
<line x1="100" y1="280" x2="300" y2="280" stroke="#8b949e" stroke-width="1" marker-end="url(#loop-start-dark-arrow)"/>
<rect x="162" y="252" width="76" height="20" rx="2" fill="#0d1117"/>
<text x="200.0" y="267" class="arrow-label" text-anchor="middle" fill="#c9d1d9">3. START</text>
<line x1="300" y1="320" x2="620" y2="320" stroke="#8b949e" stroke-width="1" marker-end="url(#loop-start-dark-arrow)"/>
<rect x="422" y="292" width="76" height="20" rx="2" fill="#0d1117"/>
<text x="460.0" y="307" class="arrow-label" text-anchor="middle" fill="#c9d1d9">4. BUILD</text>
<line x1="620" y1="360" x2="100" y2="360" stroke="#8b949e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#loop-start-dark-arrow)"/>
<rect x="324" y="332" width="72" height="20" rx="2" fill="#0d1117"/>
<text x="360.0" y="347" class="arrow-label" text-anchor="middle" fill="#c9d1d9">5. CODE</text>
<line x1="100" y1="400" x2="300" y2="400" stroke="#8b949e" stroke-width="1" marker-end="url(#loop-start-dark-arrow)"/>
<rect x="150" y="372" width="100" height="20" rx="2" fill="#0d1117"/>
<text x="200.0" y="387" class="arrow-label" text-anchor="middle" fill="#c9d1d9">6. EVIDENCE</text>
<rect x="40" y="96" width="120" height="48" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="100.0" y="124.0" class="node" text-anchor="middle" fill="#f0f6fc">You</text>
<rect x="240" y="96" width="120" height="48" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="300.0" y="124.0" class="node" text-anchor="middle" fill="#f0f6fc">oah</text>
<rect x="560" y="96" width="120" height="48" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
<text x="620.0" y="124.0" class="node" text-anchor="middle" fill="#d29922">Claude Code</text>
<line x1="40" y1="444" x2="680" y2="444" stroke="#30363d" stroke-width="1"/>
<text x="40" y="468" class="label" text-anchor="start" fill="#c9d1d9">Solid: request. Dashed: return. The table below gives each command.</text>
</svg>
