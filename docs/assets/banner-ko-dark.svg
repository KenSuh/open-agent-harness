<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banner-ko-dark-title banner-ko-dark-desc" id="banner-ko-dark-root">
<title id="banner-ko-dark-title">open-agent-harness</title>
<desc id="banner-ko-dark-desc">open-agent-harness: “그냥 묻고, 확인만 하면 돼.” AI가 만들고 검토하고 기록하며, 사용자는 판단이 필요할 때 답하고 반영 전에 확인한다는 문구와 선으로 그린 OAH 모노그램, oah.rodeo를 보여 준다.</desc>
  <defs>
      <style>#banner-ko-dark-root { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; color: #f5f5f5; }
      #banner-ko-dark-root .diagram-container { width: 100%; overflow-x: auto; scrollbar-color: #bfc0c0 #2d3142; }
      #banner-ko-dark-root text { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f5f5f5; }
      #banner-ko-dark-root .headline { font-family: "Noto Serif KR", "AppleMyungjo", "Batang", "Noto Serif CJK KR", "Instrument Serif", Georgia, serif; font-size: 84px; font-weight: 400; letter-spacing: -.025em; }
      #banner-ko-dark-root .identity { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 28px; font-weight: 500; }
      #banner-ko-dark-root .engines { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 22px; font-weight: 400; fill: #bfc0c0; }
      #banner-ko-dark-root .lead { font-size: 34px; font-weight: 500; }
      #banner-ko-dark-root .detail { font-size: 28px; font-weight: 400; fill: #bfc0c0; }
      #banner-ko-dark-root ::selection { background: #f5f5f5; color: #2d3142; }
      @media print {
#banner-ko-dark-root .diagram-container { overflow-x: visible; }
}</style>
