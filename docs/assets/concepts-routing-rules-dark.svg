<title id="concepts-routing-rules-dark-title">Routing · tier, model and effort</title>
<desc id="concepts-routing-rules-dark-desc">The task&#x27;s stage, kind and Scope paths, with explicit axes winning, feed fixed rules and a tier, packet or flag selection precedes CLI-supported model and effort, and a sufficiently confident Jev judgement can move the tier without crossing its floor before the plan, brief and run record.</desc>
<defs>
