<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 1244" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-routing-rules-dark-title concepts-routing-rules-dark-desc" data-diagram-type="Flowchart" data-size="fit" id="concepts-routing-rules-dark-root">
<title id="concepts-routing-rules-dark-title">Routing · tier, model and effort</title>
<desc id="concepts-routing-rules-dark-desc">The task's stage, kind and Scope paths, with explicit axes winning, feed fixed rules and a tier; packet or flag selection precedes CLI-supported model and effort, and a sufficiently confident Jev judgement can move the tier without crossing its floor before the plan, brief and run record.</desc>
<defs>
      <style>#concepts-routing-rules-dark-root { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; color: #f5f5f5; }
      #concepts-routing-rules-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-routing-rules-dark-root text { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f5f5f5; }
      #concepts-routing-rules-dark-root .title { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; }
      #concepts-routing-rules-dark-root .node { font-size: 16px; font-weight: 600; }
      #concepts-routing-rules-dark-root .sub { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #bfc0c0; }
      #concepts-routing-rules-dark-root .technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
      #concepts-routing-rules-dark-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #bfc0c0; }
      #concepts-routing-rules-dark-root .prose { font-size: 12px; font-weight: 400; fill: #bfc0c0; }
      #concepts-routing-rules-dark-root .zone-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 500; fill: #bfc0c0; }
      #concepts-routing-rules-dark-root .arrow-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #bfc0c0; }
      #concepts-routing-rules-dark-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #bfc0c0; }
      #concepts-routing-rules-dark-root .ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #f5f5f5; opacity: .06; }
      @media print {
#concepts-routing-rules-dark-root .diagram-container { overflow-x: visible; }
}</style>
