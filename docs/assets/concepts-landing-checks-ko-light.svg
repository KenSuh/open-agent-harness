<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-landing-checks-ko-light-title concepts-landing-checks-ko-light-desc" data-diagram-type="Flowchart" data-size="fit" id="concepts-landing-checks-ko-light-root">
<title id="concepts-landing-checks-ko-light-title">반영 · CI와 사용자 확인</title>
<desc id="concepts-landing-checks-ko-light-desc">풀 리퀘스트로 저장소의 CI와 secrets 워크플로가 실행되고 gh가 정확한 HEAD 검사를 읽으며 미검증 CI는 그 head에 기록된 예외가 필요하고 반영 때 다시 검사와 사용자 확인을 거쳐 HEAD를 fast-forward push한다.</desc>
<defs>
      <style>#concepts-landing-checks-ko-light-root { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: #2d3142; }
      #concepts-landing-checks-ko-light-root .diagram-container { width: 100%; overflow-x: auto; }
