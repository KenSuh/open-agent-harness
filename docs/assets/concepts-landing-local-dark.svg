      #concepts-landing-local-dark-root .title { font-size: 28px; font-weight: 600; }
      #concepts-landing-local-dark-root .group { font-size: 14px; font-weight: 600; }
      #concepts-landing-local-dark-root .node { font-size: 12px; font-weight: 600; }
      #concepts-landing-local-dark-root .label { font-size: 12px; font-weight: 400; }
      #concepts-landing-local-dark-root .arrow-label { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 400; }
      @media print {
#concepts-landing-local-dark-root .diagram-container { overflow-x: visible; }
}</style>
