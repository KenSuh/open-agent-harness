<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 956" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-landing-local-dark-title concepts-landing-local-dark-desc" data-source-diagram="5" id="concepts-landing-local-dark-root">
<title id="concepts-landing-local-dark-title">Landing · local hooks</title>
<desc id="concepts-landing-local-dark-desc">Opt-in local hooks check wiki commits, refresh the impact map, check for open leases and scan pushed commits when gitleaks is installed, while pushes feed secrets checks and pull requests and Claude has Stop and SessionStart hooks.</desc>
<defs>
