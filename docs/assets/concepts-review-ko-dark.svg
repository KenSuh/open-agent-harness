<title id="concepts-review-ko-dark-title">리뷰, 수정, 다시 리뷰</title>
<desc id="concepts-review-ko-dark-desc">Codex가 읽기 전용 스냅샷을 리뷰하고 승인이나 P2/P3만 남으면 수렴하며 P0/P1을 고친 뒤 사용자의 확인·커밋·bind를 거쳐 다시 리뷰하되 고친 종류가 반복되거나 설계 변경이 필요하면 멈추고 사용자 결정을 구한다.</desc>
<defs>
      <style>#concepts-review-ko-dark-root { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: #f5f5f5; }
      #concepts-review-ko-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-review-ko-dark-root text { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; fill: #f5f5f5; }
      #concepts-review-ko-dark-root .title { font-family: "Instrument Serif", "Noto Serif KR", "AppleMyungjo", "Batang", "Noto Serif CJK KR", serif; font-size: 28px; font-weight: 400; }
      #concepts-review-ko-dark-root .node { font-size: 16px; font-weight: 600; }
      #concepts-review-ko-dark-root .sub { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #bfc0c0; }
      #concepts-review-ko-dark-root .technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
      #concepts-review-ko-dark-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #bfc0c0; }
      #concepts-review-ko-dark-root .prose { font-size: 12px; font-weight: 400; fill: #bfc0c0; }
      #concepts-review-ko-dark-root .zone-label { font-size: 12px; font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-weight: 500; fill: #bfc0c0; }
      #concepts-review-ko-dark-root .arrow-label { font-size: 12px; font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-weight: 500; fill: #bfc0c0; }
      #concepts-review-ko-dark-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #bfc0c0; }
      #concepts-review-ko-dark-root .ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #f5f5f5; opacity: .06; }
      @media print {
#concepts-review-ko-dark-root .diagram-container { overflow-x: visible; }
}</style>
