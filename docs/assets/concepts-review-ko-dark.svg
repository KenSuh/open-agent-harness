<text x="40" y="668" class="label" text-anchor="start" fill="#c9d1d9">1 · 승인, 또는 P2/P3만</text>
<text x="40" y="696" class="label" text-anchor="start" fill="#c9d1d9">2 · P0/P1 지적</text>
<text x="40" y="724" class="label" text-anchor="start" fill="#c9d1d9">3 · 이미 고친 종류가 다시 나오거나</text>
<text x="64" y="744" class="label" text-anchor="start" fill="#c9d1d9">설계 변경이 필요</text>
<line x1="40" y1="764" x2="840" y2="764" stroke="#30363d"/>
<text x="40" y="792" class="label" text-anchor="start" fill="#c9d1d9">수정본은 사용자가 확인·커밋·bind한 뒤 다시 리뷰로 돌아간다.</text>
