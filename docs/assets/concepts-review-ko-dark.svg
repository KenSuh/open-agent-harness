<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 824" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-review-ko-dark-title concepts-review-ko-dark-desc" data-source-diagram="4" id="concepts-review-ko-dark-root">
<title id="concepts-review-ko-dark-title">리뷰, 수정, 다시 리뷰</title>
<desc id="concepts-review-ko-dark-desc">Codex가 읽기 전용 스냅샷을 리뷰하고 승인이나 P2/P3만 남으면 수렴하며 P0/P1을 고친 뒤 사용자의 확인·커밋·bind를 거쳐 다시 리뷰하되 고친 종류가 반복되거나 설계 변경이 필요하면 멈추고 사용자 결정을 구한다.</desc>
<defs>
      <style>#concepts-review-ko-dark-root { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
      #concepts-review-ko-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-review-ko-dark-root .title { font-size: 28px; font-weight: 600; }
      #concepts-review-ko-dark-root .group { font-size: 14px; font-weight: 600; }
      #concepts-review-ko-dark-root .node { font-size: 12px; font-weight: 600; }
      #concepts-review-ko-dark-root .label { font-size: 12px; font-weight: 400; }
      #concepts-review-ko-dark-root .arrow-label { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
      @media print {
#concepts-review-ko-dark-root .diagram-container { overflow-x: visible; }
}</style>
