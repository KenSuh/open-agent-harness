<path d="M 120,608 L 80,608 Q 72,608 72,616 L 72,816" data-edge-id="e10" data-from="land" data-to="exc" data-label="" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#concepts-landing-checks-ko-dark-arrow)"/>
