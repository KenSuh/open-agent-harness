<rect x="256" y="444" width="128" height="20" rx="2" fill="#0d1117"/>
<text x="320.0" y="458" class="arrow-label" text-anchor="middle" fill="#c9d1d9">1. 검사 기록</text>
<rect x="496" y="444" width="128" height="20" rx="2" fill="#0d1117"/>
<text x="560.0" y="458" class="arrow-label" text-anchor="middle" fill="#c9d1d9">1. 검사 기록</text>
<rect x="80" y="716" width="112" height="20" rx="2" fill="#0d1117"/>
<text x="136.0" y="730" class="arrow-label" text-anchor="middle" fill="#c9d1d9">CI 예외</text>
<rect x="736" y="716" width="64" height="20" rx="2" fill="#0d1117"/>
<text x="768.0" y="730" class="arrow-label" text-anchor="middle" fill="#c9d1d9">반영</text>
<g data-node-id="pr" data-source-label="main으로 가는 풀 리퀘스트">
<rect x="240" y="104" width="400" height="56" rx="20" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="440.0" y="136.0" class="node" text-anchor="middle" fill="#f0f6fc">main으로 가는 풀 리퀘스트</text>
</g>
<g data-node-id="tests" data-parent="actions" data-source-label="ci: 테스트, 설치, oah --version, 개인정보 검사
macOS, Windows, docs/**와 *.md만 바뀐 PR은 제외, 수동 실행">
<rect x="56" y="264" width="368" height="156" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="240.0" y="326.0" class="node" text-anchor="middle" fill="#f0f6fc">ci: 테스트, 설치, oah --version, 개인정보 검사</text>
<text x="240.0" y="346.0" class="label" text-anchor="middle" fill="#c9d1d9">macOS, Windows, docs/**와 *.md만 바뀐 PR은</text>
<text x="240.0" y="366.0" class="label" text-anchor="middle" fill="#c9d1d9">제외, 수동 실행</text>
</g>
<g data-node-id="secrets" data-parent="actions" data-source-label="secrets: gitleaks와 개인정보 검사, 전체 기록
