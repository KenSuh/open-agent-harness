<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 1136" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-landing-checks-ko-dark-title concepts-landing-checks-ko-dark-desc" data-source-diagram="5" id="concepts-landing-checks-ko-dark-root">
<title id="concepts-landing-checks-ko-dark-title">반영 · CI와 사용자 확인</title>
<desc id="concepts-landing-checks-ko-dark-desc">풀 리퀘스트로 저장소의 CI와 secrets 워크플로가 실행되고 gh가 정확한 HEAD 검사를 읽으며 미검증 CI는 그 head에 기록된 예외가 필요하고 반영 때 다시 검사와 사용자 확인을 거쳐 HEAD를 fast-forward push한다.</desc>
<defs>
      <style>#concepts-landing-checks-ko-dark-root { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
      #concepts-landing-checks-ko-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-landing-checks-ko-dark-root .title { font-size: 28px; font-weight: 600; }
      #concepts-landing-checks-ko-dark-root .group { font-size: 14px; font-weight: 600; }
      #concepts-landing-checks-ko-dark-root .node { font-size: 12px; font-weight: 600; }
      #concepts-landing-checks-ko-dark-root .label { font-size: 12px; font-weight: 400; }
      #concepts-landing-checks-ko-dark-root .arrow-label { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
      @media print {
#concepts-landing-checks-ko-dark-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="concepts-landing-checks-ko-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b949e"/></marker>
<marker id="concepts-landing-checks-ko-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3fb950"/></marker>
<marker id="concepts-landing-checks-ko-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/></marker>
</defs>
<rect x="0" y="0" width="880" height="1136" rx="0" fill="#0d1117"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#f0f6fc">반영 · CI와 사용자 확인</text>
<g data-container-id="actions">
<rect x="40" y="216" width="800" height="228" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
