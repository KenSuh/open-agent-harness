<rect x="456" y="264" width="368" height="128" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="640.0" y="322.0" class="node" text-anchor="middle" fill="#f0f6fc">secrets: gitleaks와 개인정보 검사, 전체 기록</text>
<text x="640.0" y="342.0" class="label" text-anchor="middle" fill="#c9d1d9">모든 풀 리퀘스트와 푸시, 수동 실행</text>
</g>
<g data-node-id="land" data-source-label="oah land --check, 정확한 HEAD
리스, 의도, 리뷰, 게이트, 영향,
필수 검사, fast-forward, 검사, CI">
<polygon points="440.0,496 760,608.0 440.0,720 120,608.0" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
<text x="440.0" y="592.0" class="node" text-anchor="middle" fill="#58a6ff">oah land --check, 정확한 HEAD</text>
<text x="440.0" y="612.0" class="label" text-anchor="middle" fill="#c9d1d9">리스, 의도, 리뷰, 게이트, 영향,</text>
<text x="440.0" y="632.0" class="label" text-anchor="middle" fill="#c9d1d9">필수 검사, fast-forward, 검사, CI</text>
</g>
<g data-node-id="exc" data-source-label="검증 안 된 CI는 막힘: OAH_LAND_CI_UNVERIFIED
--accept-unverified-ci 이유로 그 head에 예외를 기록할 때만 통과">
<rect x="40" y="816" width="384" height="144" rx="20" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="232.0" y="872.0" class="node" text-anchor="middle" fill="#f0f6fc">검증 안 된 CI는 막힘: OAH_LAND_CI_UNVERIFIED</text>
<text x="232.0" y="892.0" class="label" text-anchor="middle" fill="#c9d1d9">--accept-unverified-ci 이유로 그 head에 예외를</text>
<text x="232.0" y="912.0" class="label" text-anchor="middle" fill="#c9d1d9">기록할 때만 통과</text>
</g>
<g data-node-id="landed" data-source-label="oah land --merge
다시 확인하고, 사용자가 확인하면
HEAD를 fast-forward push">
<rect x="488" y="816" width="352" height="144" rx="20" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
<text x="664.0" y="872.0" class="node" text-anchor="middle" fill="#58a6ff">oah land --merge</text>
<text x="664.0" y="892.0" class="label" text-anchor="middle" fill="#c9d1d9">다시 확인하고, 사용자가 확인하면</text>
<text x="664.0" y="912.0" class="label" text-anchor="middle" fill="#c9d1d9">HEAD를 fast-forward push</text>
</g>
<text x="40" y="1012" class="group" text-anchor="start" fill="#c9d1d9">전이 조건</text>
<text x="40" y="1040" class="label" text-anchor="start" fill="#c9d1d9">1 · gh가 HEAD의 check run을 읽음</text>
<line x1="40" y1="1076" x2="840" y2="1076" stroke="#30363d"/>
<text x="40" y="1104" class="label" text-anchor="start" fill="#c9d1d9">점선은 기록되는 CI 예외다. 반영 때 다시 검사하고 사용자 확인을 기다린다.</text>
</svg>
