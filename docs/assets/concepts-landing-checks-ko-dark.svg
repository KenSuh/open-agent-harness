<title id="concepts-landing-checks-ko-dark-title">반영 · CI와 사용자 확인</title>
<desc id="concepts-landing-checks-ko-dark-desc">풀 리퀘스트로 저장소의 CI와 secrets 워크플로가 실행되고 gh가 정확한 HEAD 검사를 읽으며 미검증 CI는 그 head에 기록된 예외가 필요하고 반영 때 다시 검사와 사용자 확인을 거쳐 HEAD를 fast-forward push한다.</desc>
