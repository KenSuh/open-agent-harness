<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 540 964" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="desktop-start-ko-light-title desktop-start-ko-light-desc" data-diagram-type="Process" data-size="fit" id="desktop-start-ko-light-root">
<title id="desktop-start-ko-light-title">OAH 데스크톱 시작하기</title>
<desc id="desktop-start-ko-light-desc">Agents에서 쓸 수 있는 에이전트를 확인하고 + Open…으로 Git 작업 폴더를 고른다. Team Workflow에서 단계마다 에이전트를 직접 고르고 규칙을 동기화한다. 필요할 때 Explore와 Installed에서 스킬을 관리하거나 Team Workflow → Project Tools에서 Project Wiki, Impact Map, 선택 기능인 Jev를 설정한다. 코딩은 각 에이전트의 도구에서 하며, 선택 사항인 안내형 설계는 macOS의 Claude Code와 Python 소스 CLI를 쓴다.</desc>
<defs>
      <style>#desktop-start-ko-light-root { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: #2d3142; }
      #desktop-start-ko-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #desktop-start-ko-light-root text { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; fill: #2d3142; }
      #desktop-start-ko-light-root .title { font-family: "Instrument Serif", "Noto Serif KR", "AppleMyungjo", "Batang", "Noto Serif CJK KR", serif; font-size: 28px; font-weight: 400; }
      #desktop-start-ko-light-root .node { font-size: 16px; font-weight: 600; }
      #desktop-start-ko-light-root .sub { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #desktop-start-ko-light-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #4f5d75; }
      #desktop-start-ko-light-root .prose { font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #desktop-start-ko-light-root .zone-label { font-size: 12px; font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-weight: 500; fill: #4f5d75; }
      #desktop-start-ko-light-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #4f5d75; }
      @media print {
#desktop-start-ko-light-root .diagram-container { overflow-x: visible; }
}</style>
