<text x="56" y="756" class="node" text-anchor="start">배정한 에이전트로 작업하기</text>
<text x="56" y="780" class="prose" text-anchor="start">각 에이전트의 도구에서 작업하고 동기화된 규칙을 따른다.</text>
<text x="56" y="798" class="prose" text-anchor="start">선택 사항인 안내형 설계는 macOS의 Claude Code에서</text>
<text x="56" y="816" class="prose" text-anchor="start">Python 소스 CLI와 함께 쓴다.</text>
</g>
