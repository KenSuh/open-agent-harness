<text x="40" y="48" class="tag" text-anchor="start">OAH DESKTOP / PROCESS</text>
<text x="40" y="88" class="title" text-anchor="start">OAH 데스크톱 시작하기</text>
<g data-node-id="outside" data-source-label="앱 밖에서 배정한 에이전트로 작업하기 각 에이전트의 도구에서 작업하고 동기화된 규칙을 따른다. 선택 사항인 안내형 설계는 macOS의 Claude Code에서 Python 소스 CLI와 함께 쓴다.">
