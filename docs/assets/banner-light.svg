<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">open-agent-harness</title>
<desc id="desc">open-agent-harness: Claude Code and Codex CLI as one disciplined team on your own repository. Claude Code implements, Codex CLI reviews and fixes until the review converges, and the work lands after you confirm. TypeSafe Jev, an optional judge, judges difficulty, model choice and ranking. Review ends on convergence or stops for a decision; a round limit is optional. Leases, gates, the impact map and the wiki are the rails.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; text-anchor: middle; }
.title { font-size: 72px; font-weight: 700; fill: #1f2328; }
.pitch { font-size: 34px; fill: #424a53; }
.jev { font-size: 34px; font-weight: 700; fill: #1f2328; }
.jevhint { font-size: 34px; fill: #424a53; }
.name { font-size: 34px; font-weight: 700; fill: #1f2328; }
.hint { font-size: 34px; fill: #424a53; }
.rail { font-size: 34px; font-weight: 600; fill: #424a53; }
</style>
<rect x="1" y="1" width="1198" height="563" rx="20" fill="url(#bg)" stroke="#d0d7de" stroke-width="2"/>
<text class="title" x="600" y="85">open-agent-harness</text>
<text class="pitch" x="600" y="133">Claude Code and Codex CLI as one disciplined team</text>
<text class="pitch" x="600" y="175">on your own repository</text>
<rect x="120" y="195" width="960" height="100" rx="16" fill="#fbefff" stroke="#8250df" stroke-width="2.5"/>
<text class="jev" x="600" y="230">TypeSafe Jev · optional judge</text>
<text class="jevhint" x="600" y="272">judges difficulty, model choice and ranking</text>
<path d="M420,295 C420,315 200,309 200,321" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<line x1="560" y1="295" x2="560" y2="321" stroke="#8250df" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="40" y="325" width="320" height="135" rx="16" fill="#fff8c5" stroke="#9a6700" stroke-width="2.5"/>
<text class="name" x="200" y="380">Claude Code</text>
<text class="hint" x="200" y="421">implements</text>
<rect x="385" y="325" width="350" height="135" rx="16" fill="#dafbe1" stroke="#1a7f37" stroke-width="2.5"/>
<text class="name" x="560" y="360">Codex CLI</text>
<text class="hint" x="560" y="401">reviews &amp; fixes</text>
<text class="hint" x="560" y="442">until converged</text>
<rect x="760" y="325" width="400" height="135" rx="16" fill="#ddf4ff" stroke="#0969da" stroke-width="2.5"/>
<text class="name" x="960" y="380">Lands</text>
<text class="hint" x="960" y="421">after you confirm</text>
<line x1="362" y1="392" x2="381" y2="392" stroke="#6e7781" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="737" y1="392" x2="756" y2="392" stroke="#6e7781" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M590,462 C590,482 530,482 530,462" fill="none" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="80" y1="517" x2="1120" y2="517" stroke="#6e7781" stroke-width="2"/>
<rect x="110" y="490" width="230" height="54" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="rail" x="225" y="525">leases</text>
<rect x="360" y="490" width="230" height="54" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="rail" x="475" y="525">gates</text>
<rect x="600" y="490" width="250" height="54" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="rail" x="725" y="525">impact map</text>
<rect x="860" y="490" width="230" height="54" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="rail" x="975" y="525">wiki</text>
</svg>
