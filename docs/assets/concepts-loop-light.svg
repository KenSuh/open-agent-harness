<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 952" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-loop-light-title concepts-loop-light-desc" data-source-diagram="0" id="concepts-loop-light-root">
<title id="concepts-loop-light-title">The task loop</title>
<desc id="concepts-loop-light-desc">A packet passes through a lease, Claude implementation, gates and wiki evidence, and Codex review, with requested fixes returning to evidence before convergence, finish and landing after your confirmation.</desc>
<defs>
      <style>#concepts-loop-light-root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; }
      #concepts-loop-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-loop-light-root .title { font-size: 28px; font-weight: 600; }
      #concepts-loop-light-root .group { font-size: 14px; font-weight: 600; }
      #concepts-loop-light-root .node { font-size: 12px; font-weight: 600; }
      #concepts-loop-light-root .label { font-size: 12px; font-weight: 400; }
      #concepts-loop-light-root .arrow-label { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 400; }
      @media print {
#concepts-loop-light-root .diagram-container { overflow-x: visible; }
}</style>
