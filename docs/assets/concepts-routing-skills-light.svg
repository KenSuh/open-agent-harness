<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 1384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-routing-skills-light-title concepts-routing-skills-light-desc" data-diagram-type="Flowchart" data-size="fit" id="concepts-routing-skills-light-root">
<title id="concepts-routing-skills-light-title">Routing · skill order and Jev</title>
<desc id="concepts-routing-skills-light-desc">The task yields a reasoned deterministic skill list, configured and enabled reranking uses Jev only with candidates, success records used, and no candidates, disabling or errors record unused with the original order kept on error.</desc>
<defs>
      <style>#concepts-routing-skills-light-root { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; color: #2d3142; }
      #concepts-routing-skills-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-routing-skills-light-root text { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #2d3142; }
      #concepts-routing-skills-light-root .title { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; }
      #concepts-routing-skills-light-root .node { font-size: 16px; font-weight: 600; }
      #concepts-routing-skills-light-root .sub { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #concepts-routing-skills-light-root .technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
      #concepts-routing-skills-light-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #4f5d75; }
      #concepts-routing-skills-light-root .prose { font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #concepts-routing-skills-light-root .zone-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 500; fill: #4f5d75; }
      #concepts-routing-skills-light-root .arrow-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #4f5d75; }
      #concepts-routing-skills-light-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #4f5d75; }
      #concepts-routing-skills-light-root .ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #2d3142; opacity: .06; }
      @media print {
#concepts-routing-skills-light-root .diagram-container { overflow-x: visible; }
}</style>
<pattern id="concepts-routing-skills-light-dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity=".10"/></pattern>
