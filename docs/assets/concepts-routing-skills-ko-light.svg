<title id="concepts-routing-skills-ko-light-title">라우팅 · 스킬 순서와 Jev</title>
<desc id="concepts-routing-skills-ko-light-desc">작업에서 이유가 있는 결정적 스킬 목록을 만들고 설정과 활성화 조건을 갖추고 후보가 있을 때만 Jev를 쓰며 성공은 used로, 후보 없음·비활성화·오류는 unused로 기록하고 오류면 기존 순서를 유지한다.</desc>
