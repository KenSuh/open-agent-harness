<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 1252" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-routing-skills-ko-light-title concepts-routing-skills-ko-light-desc" data-source-diagram="2" id="concepts-routing-skills-ko-light-root">
<title id="concepts-routing-skills-ko-light-title">라우팅 · 스킬 순서와 Jev</title>
<desc id="concepts-routing-skills-ko-light-desc">작업에서 이유가 있는 결정적 스킬 목록을 만들고 설정과 활성화 조건을 갖추고 후보가 있을 때만 Jev를 쓰며 성공은 used로, 후보 없음·비활성화·오류는 unused로 기록하고 오류면 기존 순서를 유지한다.</desc>
<defs>
      <style>#concepts-routing-skills-ko-light-root { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; }
      #concepts-routing-skills-ko-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-routing-skills-ko-light-root .title { font-size: 28px; font-weight: 600; }
      #concepts-routing-skills-ko-light-root .group { font-size: 14px; font-weight: 600; }
      #concepts-routing-skills-ko-light-root .node { font-size: 12px; font-weight: 600; }
      #concepts-routing-skills-ko-light-root .label { font-size: 12px; font-weight: 400; }
      #concepts-routing-skills-ko-light-root .arrow-label { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
      @media print {
#concepts-routing-skills-ko-light-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="concepts-routing-skills-ko-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e7781"/></marker>
<marker id="concepts-routing-skills-ko-light-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a7f37"/></marker>
<marker id="concepts-routing-skills-ko-light-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
</defs>
<rect x="0" y="0" width="880" height="1252" rx="0" fill="#ffffff"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#1f2328">라우팅 · 스킬 순서와 Jev</text>
<line x1="440" y1="168" x2="440" y2="208" data-edge-id="e6" data-from="task" data-to="skills" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-routing-skills-ko-light-arrow)"/>
<line x1="440" y1="272" x2="440" y2="312" data-edge-id="e7" data-from="skills" data-to="ask" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-routing-skills-ko-light-arrow)"/>
<path d="M 192,400 L 72,400 Q 64,400 64,408 L 64,552" data-edge-id="e8" data-from="ask" data-to="jev" data-label="예, 후보 있음" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-routing-skills-ko-light-arrow)"/>
<path d="M 688,400 L 808,400 Q 816,400 816,408 L 816,552" data-edge-id="e9" data-from="ask" data-to="unused" data-label="예, 후보 없음" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-routing-skills-ko-light-arrow)"/>
<path d="M 440,488 L 440,512 Q 440,520 448,520 L 552,520 Q 560,520 560,528 L 560,552" data-edge-id="e10" data-from="ask" data-to="unused" data-label="아니오" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-routing-skills-ko-light-arrow)"/>
<line x1="216" y1="680" x2="216" y2="784" data-edge-id="e11" data-from="jev" data-to="used" data-label="점수 계산 성공" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-routing-skills-ko-light-arrow)"/>
<line x1="392" y1="616" x2="488" y2="616" data-edge-id="e12" data-from="jev" data-to="unused" data-label="오류, 기존 순서 유지" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-routing-skills-ko-light-arrow)"/>
