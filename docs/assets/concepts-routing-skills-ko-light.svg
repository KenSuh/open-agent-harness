<rect x="72" y="456" width="120" height="20" rx="2" fill="#ffffff"/>
<text x="132.0" y="470" class="arrow-label" text-anchor="middle" fill="#424a53">1. 후보 있음</text>
<rect x="696" y="456" width="112" height="20" rx="2" fill="#ffffff"/>
<text x="752.0" y="470" class="arrow-label" text-anchor="middle" fill="#424a53">2. 후보 없음</text>
<rect x="448" y="492" width="88" height="20" rx="2" fill="#ffffff"/>
<text x="492.0" y="506" class="arrow-label" text-anchor="middle" fill="#424a53">3. 아니오</text>
<rect x="224" y="724" width="96" height="20" rx="2" fill="#ffffff"/>
<text x="272.0" y="738" class="arrow-label" text-anchor="middle" fill="#424a53">4. 성공</text>
<rect x="400" y="588" width="80" height="20" rx="2" fill="#ffffff"/>
<text x="440.0" y="602" class="arrow-label" text-anchor="middle" fill="#424a53">5. 오류</text>
<g data-node-id="task" data-source-label="작업: 단계, 종류, Scope 경로
직접 준 축이 우선">
<rect x="244" y="104" width="392" height="64" rx="20" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="440.0" y="130.0" class="node" text-anchor="middle" fill="#1f2328">작업: 단계, 종류, Scope 경로</text>
<text x="440.0" y="150.0" class="label" text-anchor="middle" fill="#424a53">직접 준 축이 우선</text>
</g>
<g data-node-id="skills" data-source-label="결정적인 스킬 목록
스킬마다 이유">
<rect x="244" y="208" width="392" height="64" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="440.0" y="234.0" class="node" text-anchor="middle" fill="#1f2328">결정적인 스킬 목록</text>
<text x="440.0" y="254.0" class="label" text-anchor="middle" fill="#424a53">스킬마다 이유</text>
</g>
<g data-node-id="ask" data-source-label="--no-rerank가 아니고, 직접 켰고,
제공자 설정과 키가 있는가?">
<polygon points="440.0,312 688,400.0 440.0,488 192,400.0" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="440.0" y="394.0" class="node" text-anchor="middle" fill="#1f2328">--no-rerank가 아니고, 직접 켰고,</text>
<text x="440.0" y="414.0" class="label" text-anchor="middle" fill="#424a53">제공자 설정과 키가 있는가?</text>
</g>
<g data-node-id="jev" data-source-label="TypeSafe Jev 제공자
순서만 바꾸고 더하거나 빼지 않음
Intent와 Scope 경로로 난이도 판정">
<rect x="40" y="552" width="352" height="128" rx="6" fill="#f6f8fa" stroke="#8250df" stroke-width="1"/>
<text x="216.0" y="600.0" class="node" text-anchor="middle" fill="#8250df">TypeSafe Jev 제공자</text>
<text x="216.0" y="620.0" class="label" text-anchor="middle" fill="#424a53">순서만 바꾸고 더하거나 빼지 않음</text>
<text x="216.0" y="640.0" class="label" text-anchor="middle" fill="#424a53">Intent와 Scope 경로로 난이도 판정</text>
</g>
<g data-node-id="used" data-source-label="rerank=used">
<rect x="40" y="784" width="352" height="48" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="216.0" y="812.0" class="node" text-anchor="middle" fill="#1f2328">rerank=used</text>
</g>
<g data-node-id="unused" data-source-label="rerank=unused(이유)
disabled-by-brief, not-enabled, not-configured,
unknown-provider, no key, no-candidates, error:CODE">
<rect x="488" y="552" width="352" height="144" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="664.0" y="588.0" class="node" text-anchor="middle" fill="#1f2328">rerank=unused(이유)</text>
<text x="664.0" y="608.0" class="label" text-anchor="middle" fill="#424a53">disabled-by-brief, not-enabled,</text>
<text x="664.0" y="628.0" class="label" text-anchor="middle" fill="#424a53">not-configured,</text>
<text x="664.0" y="648.0" class="label" text-anchor="middle" fill="#424a53">unknown-provider, no key, no-candidates,</text>
<text x="664.0" y="668.0" class="label" text-anchor="middle" fill="#424a53">error:CODE</text>
</g>
<g data-node-id="brief" data-source-label="패킷 계획, 브리프, 실행 기록">
<rect x="244" y="920" width="392" height="64" rx="20" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="440.0" y="956.0" class="node" text-anchor="middle" fill="#1f2328">패킷 계획, 브리프, 실행 기록</text>
</g>
<text x="40" y="1024" class="group" text-anchor="start" fill="#424a53">전이 조건</text>
<text x="40" y="1052" class="label" text-anchor="start" fill="#424a53">1 · 예, 후보 있음</text>
<text x="40" y="1080" class="label" text-anchor="start" fill="#424a53">2 · 예, 후보 없음</text>
<text x="40" y="1108" class="label" text-anchor="start" fill="#424a53">3 · 아니오</text>
<text x="40" y="1136" class="label" text-anchor="start" fill="#424a53">4 · 점수 계산 성공</text>
<text x="40" y="1164" class="label" text-anchor="start" fill="#424a53">5 · 오류, 기존 순서 유지</text>
<line x1="40" y1="1192" x2="840" y2="1192" stroke="#d0d7de"/>
<text x="40" y="1220" class="label" text-anchor="start" fill="#424a53">Jev의 난이도 판정은 앞 그림의 tier 선택으로 연결된다.</text>
</svg>
