<rect x="440" y="468" width="64" height="20" rx="2" fill="#2d3142"/>
<text x="472" y="483" class="arrow-label" text-anchor="middle">9. FIX</text>
<rect x="186" y="532" width="76" height="20" rx="2" fill="#2d3142"/>
<text x="224" y="547" class="arrow-label" text-anchor="middle">10. DIFF</text>
<rect x="194" y="596" width="76" height="20" rx="2" fill="#2d3142"/>
<text x="232" y="611" class="arrow-label" text-anchor="middle">11. BIND</text>
<rect x="186" y="756" width="92" height="20" rx="2" fill="#2d3142"/>
<text x="232" y="771" class="arrow-label" text-anchor="middle">12. FINISH</text>
<rect x="698" y="820" width="76" height="20" rx="2" fill="#2d3142"/>
<text x="736" y="835" class="arrow-label" text-anchor="middle">13. PUSH</text>
<rect x="182" y="884" width="100" height="20" rx="2" fill="#2d3142"/>
<text x="232" y="899" class="arrow-label" text-anchor="middle">14. CONFIRM</text>
<rect x="698" y="948" width="76" height="20" rx="2" fill="#2d3142"/>
<text x="736" y="963" class="arrow-label" text-anchor="middle">15. LAND</text>
<g data-node-id="you" data-source-label="You">
<rect x="40" y="144" width="176" height="96" rx="6" fill="#2d3142"/>
<rect x="40" y="144" width="176" height="96" rx="6" fill="#bfc0c0" stroke="#949eb2" stroke-width="1" fill-opacity=".10"/>
