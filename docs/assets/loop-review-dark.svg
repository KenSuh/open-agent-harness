<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1008 1212" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-review-dark-title loop-review-dark-desc" data-diagram-type="Sequence" data-size="fit" id="loop-review-dark-root">
<title id="loop-review-dark-title">Review, correct and land</title>
<desc id="loop-review-dark-desc">Codex CLI reviews and corrects in a loop, you bind each correction and finish the task, and oah lands the reviewed commit after checks and your confirmation.</desc>
<defs>
      <style>#loop-review-dark-root { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; color: #f5f5f5; }
      #loop-review-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #loop-review-dark-root text { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f5f5f5; }
      #loop-review-dark-root .title { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; }
      #loop-review-dark-root .node { font-size: 16px; font-weight: 600; }
      #loop-review-dark-root .sub { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #bfc0c0; }
      #loop-review-dark-root .technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
      #loop-review-dark-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #bfc0c0; }
      #loop-review-dark-root .prose { font-size: 12px; font-weight: 400; fill: #bfc0c0; }
      #loop-review-dark-root .zone-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 500; fill: #bfc0c0; }
      #loop-review-dark-root .arrow-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #bfc0c0; }
      #loop-review-dark-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #bfc0c0; }
      #loop-review-dark-root .ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #f5f5f5; opacity: .06; }
      @media print {
#loop-review-dark-root .diagram-container { overflow-x: visible; }
}</style>
<pattern id="loop-review-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity=".10"/></pattern>
<marker id="loop-review-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
<marker id="loop-review-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
<marker id="loop-review-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
</defs>
<rect width="1008" height="1212" fill="#2d3142"/>
<rect width="1008" height="1212" fill="url(#loop-review-dark-dots)" opacity=".55"/>
<text x="40" y="48" class="tag" text-anchor="start">OAH / SEQUENCE</text>
<text x="40" y="88" class="title" text-anchor="start">Review, correct and land</text>
<rect x="64" y="280" width="624" height="424" rx="4" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" fill-opacity=".02" stroke-opacity=".25"/>



<line x1="128" y1="240" x2="128" y2="1016" stroke="#f5f5f5" stroke-opacity=".20" stroke-dasharray="3,3"/>
<line x1="336" y1="240" x2="336" y2="1016" stroke="#f5f5f5" stroke-opacity=".20" stroke-dasharray="3,3"/>
<line x1="608" y1="240" x2="608" y2="1016" stroke="#f5f5f5" stroke-opacity=".20" stroke-dasharray="3,3"/>
<line x1="880" y1="240" x2="880" y2="1016" stroke="#f5f5f5" stroke-opacity=".20" stroke-dasharray="3,3"/>
<g><rect x="64" y="280" width="72" height="28" rx="2" fill="#2d3142" stroke="#bfc0c0" stroke-width="1"/><text x="100" y="299" class="label" text-anchor="middle">LOOP</text><rect x="72" y="312" width="600" height="28" rx="2" fill="#2d3142"/><text x="80" y="332" class="prose" text-anchor="start">Until review converges; pause when a decision is needed.</text></g>
<path d="M 336,368 L 608,368" data-edge-id="7" data-from="oah" data-to="codex" data-label="7. REVIEW" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#loop-review-dark-arrow)"/>
<path d="M 608,432 L 336,432" data-edge-id="8" data-from="codex" data-to="oah" data-label="8. FINDINGS" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#loop-review-dark-arrow)"/>
<path d="M 336,496 L 608,496" data-edge-id="9" data-from="oah" data-to="codex" data-label="9. FIX" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#loop-review-dark-arrow)"/>
<path d="M 608,560 L 128,560" data-edge-id="10" data-from="codex" data-to="you" data-label="10. DIFF" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#loop-review-dark-arrow)"/>
<path d="M 128,624 L 336,624" data-edge-id="11" data-from="you" data-to="oah" data-label="11. BIND" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#loop-review-dark-arrow)"/>
<path d="M 128,784 L 336,784" data-edge-id="12" data-from="you" data-to="oah" data-label="12. FINISH" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#loop-review-dark-arrow)"/>
<path d="M 128,848 L 880,848" data-edge-id="13" data-from="you" data-to="git" data-label="13. PUSH" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#loop-review-dark-arrow)"/>
<path d="M 128,912 L 336,912" data-edge-id="14" data-from="you" data-to="oah" data-label="14. CONFIRM" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#loop-review-dark-arrow)"/>
<path d="M 336,976 L 880,976" data-edge-id="15" data-from="oah" data-to="git" data-label="15. LAND" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#loop-review-dark-arrow)"/>
<rect x="430" y="340" width="84" height="20" rx="2" fill="#2d3142"/>
