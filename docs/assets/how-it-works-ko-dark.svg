<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 1484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-ko-dark-title how-it-works-ko-dark-desc" data-diagram-type="Swimlane" data-size="fit" id="how-it-works-ko-dark-root">
<title id="how-it-works-ko-dark-title">말로 요청하고, 하네스와 함께 끝낸다</title>
<desc id="how-it-works-ko-dark-desc">사용자가 말로 변경을 요청하면 설치된 규칙에 따라 의도·범위·경로를 예약하는 리스·영향 지도와 권장 선택형 TypeSafe Jev 판정을 준비하고, Claude Code가 구현하며 게이트와 위키가 증거를 남기고 Codex CLI가 검토·수정하며, 같은 문제가 반복되거나 설계 선택이 필요해 멈추면 사용자가 답하고 반영 전에 확인하며, Jev의 난이도에 따른 모델 선택은 미출시 main에 있고 안내형 설계 대화는 v0.4.0에 계획돼 있다.</desc>
