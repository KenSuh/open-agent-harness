<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-ko-dark-title how-it-works-ko-dark-desc" id="how-it-works-ko-dark-root">
<title id="how-it-works-ko-dark-title">oah의 작업 흐름</title>
<desc id="how-it-works-ko-dark-desc">사용자가 목표를 정하면 Claude Code가 구현하고 Codex CLI가 검토가 수렴할 때까지 검토와 수정을 반복하며 검사 뒤 사용자가 반영을 확인하고, 선택형 TypeSafe Jev는 난이도와 모델 선택, 스킬 순서 판정을 돕는다.</desc>
<defs>
      <style>#how-it-works-ko-dark-root { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
      #how-it-works-ko-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #how-it-works-ko-dark-root .title { font-size: 28px; font-weight: 600; }
      #how-it-works-ko-dark-root .group { font-size: 14px; font-weight: 600; }
      #how-it-works-ko-dark-root .node { font-size: 12px; font-weight: 600; }
      #how-it-works-ko-dark-root .label { font-size: 12px; font-weight: 400; }
      #how-it-works-ko-dark-root .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; }
      #how-it-works-ko-dark-root .arrow-label { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
      @media print {
#how-it-works-ko-dark-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="how-it-works-ko-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
</marker>
<marker id="how-it-works-ko-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
</marker>
<marker id="how-it-works-ko-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="544" rx="0" fill="#0d1117"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#f0f6fc">oah의 작업 흐름</text>
<line x1="162" y1="152" x2="162" y2="184" stroke="#8b949e" stroke-width="1" marker-end="url(#how-it-works-ko-dark-arrow)"/>
<line x1="162" y1="232" x2="162" y2="264" stroke="#8b949e" stroke-width="1" marker-end="url(#how-it-works-ko-dark-arrow)"/>
<line x1="162" y1="328" x2="162" y2="368" stroke="#8b949e" stroke-width="1" marker-end="url(#how-it-works-ko-dark-arrow)"/>
<rect x="40" y="104" width="244" height="48" rx="20" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="162.0" y="132.0" class="node" text-anchor="middle" fill="#f0f6fc">1. 목표를 정한다</text>
<rect x="40" y="184" width="244" height="48" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
<text x="162.0" y="212.0" class="node" text-anchor="middle" fill="#d29922">2. Claude Code가 만든다</text>
<rect x="40" y="264" width="244" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
<text x="162.0" y="284" class="node" text-anchor="middle" fill="#3fb950">3. Codex CLI가 검토한다</text>
<text x="162.0" y="300" class="label" text-anchor="middle" fill="#c9d1d9">수정하고 다시 검토한다</text>
<rect x="40" y="368" width="244" height="48" rx="20" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="162.0" y="396.0" class="node" text-anchor="middle" fill="#f0f6fc">4. 확인하고 반영한다</text>
<text x="324" y="124" class="label" text-anchor="start" fill="#c9d1d9">목표, 바꿀 파일과 확인 방법</text>
<text x="324" y="204" class="label" text-anchor="start" fill="#c9d1d9">작동하는 첫 버전을 만든다</text>
<text x="324" y="284" class="label" text-anchor="start" fill="#c9d1d9">검토가 수렴할 때까지 반복한다</text>
<text x="324" y="308" class="label" text-anchor="start" fill="#c9d1d9">판단이 필요하면 멈추고 묻는다</text>
<text x="324" y="388" class="label" text-anchor="start" fill="#c9d1d9">검사를 거친 뒤 사용자가 확인한다</text>
<text x="40" y="452" class="label" text-anchor="start" fill="#a371f7">TypeSafe Jev(선택)가 난이도와 모델 선택,</text>
<text x="40" y="472" class="label" text-anchor="start" fill="#a371f7">작업에 쓸 스킬의 순서 판정을 돕는다.</text>
<line x1="40" y1="496" x2="600" y2="496" stroke="#30363d" stroke-width="1"/>
<text x="40" y="520" class="label" text-anchor="start" fill="#c9d1d9">기본 역할 분담이다. 필요한 부분을 내 환경에 맞춘다.</text>
</svg>
