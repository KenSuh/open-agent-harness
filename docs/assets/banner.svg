<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">open-agent-harness</title>
  <desc id="desc">Banner: Claude Code implements, Codex CLI reviews and corrects in bounded rounds, TypeSafe Jev judges by ranking the candidates, then the work lands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
    .title { font-size: 52px; font-weight: 700; fill: #f8fafc; }
    .sub { font-size: 22px; fill: #cbd5e1; }
    .small { font-size: 16px; fill: #94a3b8; }
    .node { font-size: 17px; font-weight: 600; fill: #0f172a; }
    .nodehint { font-size: 13px; fill: #334155; }
    .loop { font-size: 13px; fill: #cbd5e1; }
    .judgehint { font-size: 13px; fill: #3b0764; }
  </style>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Title block -->
  <text class="title" x="60" y="118">open-agent-harness</text>
  <text class="sub" x="62" y="156">Claude Code and Codex CLI as one disciplined team</text>
  <text class="sub" x="62" y="186">on your own repository,</text>
  <text class="sub" x="62" y="216">with TypeSafe Jev as the judge.</text>
  <text class="small" x="62" y="256">oah · Python 3.11+ standard library · macOS and native Windows · MIT</text>

  <!-- Workflow sketch -->
  <g transform="translate(655 72)">
    <!-- The judge ranks the candidates that fixed rules produce, before the engine acts -->
    <rect x="100" y="-58" width="150" height="44" rx="12" fill="#e9d5ff"/>
    <text class="node" x="175" y="-39" text-anchor="middle">Jev</text>
    <text class="judgehint" x="175" y="-22" text-anchor="middle">judges and ranks</text>
    <line x1="132" y1="-13" x2="96" y2="-3" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

    <rect x="0" y="0" width="150" height="62" rx="12" fill="#fde68a"/>
    <text class="node" x="75" y="27" text-anchor="middle">Claude</text>
    <text class="nodehint" x="75" y="47" text-anchor="middle">implements</text>

    <line x1="152" y1="31" x2="196" y2="31" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="200" y="0" width="150" height="62" rx="12" fill="#a7f3d0"/>
    <text class="node" x="275" y="27" text-anchor="middle">Codex</text>
    <text class="nodehint" x="275" y="47" text-anchor="middle">reviews and fixes</text>

    <line x1="352" y1="31" x2="396" y2="31" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="400" y="0" width="90" height="62" rx="12" fill="#bfdbfe"/>
    <text class="node" x="445" y="27" text-anchor="middle">Land</text>
    <text class="nodehint" x="445" y="47" text-anchor="middle">converged</text>

    <!-- Bounded review loop under the Codex node -->
    <path d="M235,66 C235,118 315,118 315,66" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text class="loop" x="275" y="136" text-anchor="middle">bounded rounds</text>

    <!-- Supporting machinery -->
    <g transform="translate(0 160)">
      <rect x="0" y="0" width="110" height="30" rx="15" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text class="loop" x="55" y="20" text-anchor="middle">leases</text>
      <rect x="125" y="0" width="110" height="30" rx="15" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text class="loop" x="180" y="20" text-anchor="middle">gates</text>
      <rect x="250" y="0" width="110" height="30" rx="15" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text class="loop" x="305" y="20" text-anchor="middle">wiki</text>
      <rect x="375" y="0" width="115" height="30" rx="15" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text class="loop" x="432" y="20" text-anchor="middle">impact map</text>
    </g>
  </g>
</svg>
