<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-review-ko-dark-title loop-review-ko-dark-desc" id="loop-review-ko-dark-root">
<title id="loop-review-ko-dark-title">검토, 수정과 반영</title>
<desc id="loop-review-ko-dark-desc">Codex CLI가 검토와 수정을 반복하고 사용자가 수정 기록을 묶어 작업을 끝내면 oah가 검사와 사용자 확인을 거쳐 검토한 커밋을 반영한다.</desc>
<defs>
      <style>#loop-review-ko-dark-root { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
      #loop-review-ko-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #loop-review-ko-dark-root .title { font-size: 28px; font-weight: 600; }
      #loop-review-ko-dark-root .group { font-size: 14px; font-weight: 600; }
      #loop-review-ko-dark-root .node { font-size: 12px; font-weight: 600; }
      #loop-review-ko-dark-root .label { font-size: 12px; font-weight: 400; }
      #loop-review-ko-dark-root .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; }
      #loop-review-ko-dark-root .arrow-label { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
      @media print {
#loop-review-ko-dark-root .diagram-container { overflow-x: visible; }
}</style>
