<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 1064" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-impact-ranked-dark-title concepts-impact-ranked-dark-desc" data-diagram-type="Flowchart" data-size="fit" id="concepts-impact-ranked-dark-root">
<title id="concepts-impact-ranked-dark-title">Impact · ranked results</title>
<desc id="concepts-impact-ranked-dark-desc">Ranked impact results run from pin through exec and link to mention, with pin and exec identifying the exact gates and commands to rerun and the rerun lines shown with changed-since.</desc>
<defs>
      <style>#concepts-impact-ranked-dark-root { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; color: #f5f5f5; }
      #concepts-impact-ranked-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-impact-ranked-dark-root text { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f5f5f5; }
      #concepts-impact-ranked-dark-root .title { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; }
      #concepts-impact-ranked-dark-root .node { font-size: 16px; font-weight: 600; }
      #concepts-impact-ranked-dark-root .sub { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #bfc0c0; }
      #concepts-impact-ranked-dark-root .technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
      #concepts-impact-ranked-dark-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #bfc0c0; }
      #concepts-impact-ranked-dark-root .prose { font-size: 12px; font-weight: 400; fill: #bfc0c0; }
      #concepts-impact-ranked-dark-root .zone-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 500; fill: #bfc0c0; }
      #concepts-impact-ranked-dark-root .arrow-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #bfc0c0; }
      #concepts-impact-ranked-dark-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #bfc0c0; }
      #concepts-impact-ranked-dark-root .ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #f5f5f5; opacity: .06; }
      @media print {
#concepts-impact-ranked-dark-root .diagram-container { overflow-x: visible; }
}</style>
<pattern id="concepts-impact-ranked-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity=".10"/></pattern>
<marker id="concepts-impact-ranked-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
<marker id="concepts-impact-ranked-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
<marker id="concepts-impact-ranked-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
</defs>
<rect width="920" height="1064" fill="#2d3142"/>
<rect width="920" height="1064" fill="url(#concepts-impact-ranked-dark-dots)" opacity=".55"/>
