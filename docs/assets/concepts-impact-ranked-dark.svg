<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 852" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-impact-ranked-dark-title concepts-impact-ranked-dark-desc" data-source-diagram="3" id="concepts-impact-ranked-dark-root">
<title id="concepts-impact-ranked-dark-title">Impact · ranked results</title>
<desc id="concepts-impact-ranked-dark-desc">Ranked impact results run from pin through exec and link to mention, with pin and exec identifying the exact gates and commands to rerun and the rerun lines shown with changed-since.</desc>
<defs>
      <style>#concepts-impact-ranked-dark-root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
      #concepts-impact-ranked-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-impact-ranked-dark-root .title { font-size: 28px; font-weight: 600; }
      #concepts-impact-ranked-dark-root .group { font-size: 14px; font-weight: 600; }
      #concepts-impact-ranked-dark-root .node { font-size: 12px; font-weight: 600; }
      #concepts-impact-ranked-dark-root .label { font-size: 12px; font-weight: 400; }
      #concepts-impact-ranked-dark-root .arrow-label { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 400; }
      @media print {
#concepts-impact-ranked-dark-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="concepts-impact-ranked-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b949e"/></marker>
<marker id="concepts-impact-ranked-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3fb950"/></marker>
<marker id="concepts-impact-ranked-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/></marker>
</defs>
<rect x="0" y="0" width="880" height="852" rx="0" fill="#0d1117"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#f0f6fc">Impact · ranked results</text>
<g data-container-id="ranked">
<rect x="40" y="104" width="464" height="664" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="56" y="128" class="group" text-anchor="start" fill="#c9d1d9">Ranked results</text>
</g>
<line x1="272" y1="272" x2="272" y2="328" data-edge-id="e7" data-from="pinR" data-to="execR" data-label="" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-impact-ranked-dark-arrow)"/>
<line x1="272" y1="412" x2="272" y2="468" data-edge-id="e8" data-from="execR" data-to="linkR" data-label="" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-impact-ranked-dark-arrow)"/>
<line x1="272" y1="580" x2="272" y2="648" data-edge-id="e9" data-from="linkR" data-to="mentionR" data-label="" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-impact-ranked-dark-arrow)"/>
<path d="M 488,208 L 696,208 Q 704,208 704,216 L 704,328" data-edge-id="e10" data-from="pinR" data-to="rerun" data-label="" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-impact-ranked-dark-arrow)"/>
<line x1="488" y1="368" x2="568" y2="368" data-edge-id="e11" data-from="execR" data-to="rerun" data-label="" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-impact-ranked-dark-arrow)"/>
<g data-node-id="pinR" data-parent="ranked" data-source-label="pin: a gate EXPECT names it, or a gate CHECK
or workflow, manifest or config command hashes or greps it">
<rect x="56" y="144" width="432" height="128" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
<text x="272.0" y="192.0" class="node" text-anchor="middle" fill="#3fb950">pin: a gate EXPECT names it, or a gate CHECK</text>
<text x="272.0" y="212.0" class="label" text-anchor="middle" fill="#c9d1d9">or workflow, manifest or config command hashes or</text>
<text x="272.0" y="232.0" class="label" text-anchor="middle" fill="#c9d1d9">greps it</text>
</g>
<g data-node-id="execR" data-parent="ranked" data-source-label="exec: a gate CHECK or such a command runs it">
<rect x="56" y="328" width="432" height="84" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
<text x="272.0" y="374.0" class="node" text-anchor="middle" fill="#3fb950">exec: a gate CHECK or such a command runs it</text>
</g>
<g data-node-id="linkR" data-parent="ranked" data-source-label="link: its full path is named in code, tests, workflows,
wiki or a gate CHECK, migrations that define a SQL object">
<rect x="56" y="468" width="432" height="112" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="272.0" y="498.0" class="node" text-anchor="middle" fill="#f0f6fc">link: its full path is named in code, tests,</text>
<text x="272.0" y="518.0" class="node" text-anchor="middle" fill="#f0f6fc">workflows,</text>
<text x="272.0" y="538.0" class="label" text-anchor="middle" fill="#c9d1d9">wiki or a gate CHECK, migrations that define a SQL</text>
<text x="272.0" y="558.0" class="label" text-anchor="middle" fill="#c9d1d9">object</text>
</g>
<g data-node-id="mentionR" data-parent="ranked" data-source-label="mention: file name or stem match, co-change,
graph neighbour">
<rect x="56" y="648" width="432" height="80" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="272.0" y="682.0" class="node" text-anchor="middle" fill="#f0f6fc">mention: file name or stem match, co-change,</text>
<text x="272.0" y="702.0" class="label" text-anchor="middle" fill="#c9d1d9">graph neighbour</text>
</g>
<g data-node-id="rerun" data-source-label="Exact gates and commands to re-run
re-run lines with --changed-since">
<rect x="568" y="328" width="272" height="128" rx="20" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="704.0" y="366.0" class="node" text-anchor="middle" fill="#f0f6fc">Exact gates and commands to</text>
<text x="704.0" y="386.0" class="node" text-anchor="middle" fill="#f0f6fc">re-run</text>
<text x="704.0" y="406.0" class="label" text-anchor="middle" fill="#c9d1d9">re-run lines with</text>
<text x="704.0" y="426.0" class="label" text-anchor="middle" fill="#c9d1d9">--changed-since</text>
</g>
<line x1="40" y1="792" x2="840" y2="792" stroke="#30363d"/>
<text x="40" y="820" class="label" text-anchor="start" fill="#c9d1d9">pin is the same result reached by the freshness and default-branch paths.</text>
</svg>
