<path d="M 264,336 L 264,384" data-edge-id="e7" data-from="pinR" data-to="execR" data-label="" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#concepts-impact-ranked-dark-arrow)"/>
<path d="M 264,496 L 264,544" data-edge-id="e8" data-from="execR" data-to="linkR" data-label="" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#concepts-impact-ranked-dark-arrow)"/>
<path d="M 264,704 L 264,752" data-edge-id="e9" data-from="linkR" data-to="mentionR" data-label="" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#concepts-impact-ranked-dark-arrow)"/>
