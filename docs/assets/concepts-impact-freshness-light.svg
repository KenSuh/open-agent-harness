<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 1244" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-impact-freshness-light-title concepts-impact-freshness-light-desc" data-diagram-type="Flowchart" data-size="fit" id="concepts-impact-freshness-light-root">
<title id="concepts-impact-freshness-light-title">Impact · fresh inputs</title>
<desc id="concepts-impact-freshness-light-desc">A file change checks map freshness, refreshes incrementally or rebuilds when needed, reports stale instead of silently using it when refresh is disabled or inputs move, and combines the default-branch map at pin results.</desc>
<defs>
      <style>#concepts-impact-freshness-light-root { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; color: #2d3142; }
      #concepts-impact-freshness-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-impact-freshness-light-root text { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #2d3142; }
      #concepts-impact-freshness-light-root .title { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; }
      #concepts-impact-freshness-light-root .node { font-size: 16px; font-weight: 600; }
      #concepts-impact-freshness-light-root .sub { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #concepts-impact-freshness-light-root .technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
      #concepts-impact-freshness-light-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #4f5d75; }
      #concepts-impact-freshness-light-root .prose { font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #concepts-impact-freshness-light-root .zone-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 500; fill: #4f5d75; }
      #concepts-impact-freshness-light-root .arrow-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #4f5d75; }
      #concepts-impact-freshness-light-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #4f5d75; }
      #concepts-impact-freshness-light-root .ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #2d3142; opacity: .06; }
      @media print {
#concepts-impact-freshness-light-root .diagram-container { overflow-x: visible; }
}</style>
<pattern id="concepts-impact-freshness-light-dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity=".10"/></pattern>
<marker id="concepts-impact-freshness-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="concepts-impact-freshness-light-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="concepts-impact-freshness-light-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="880" height="1244" fill="#f5f5f5"/>
<rect width="880" height="1244" fill="url(#concepts-impact-freshness-light-dots)" opacity=".55"/>
<text x="40" y="48" class="tag" text-anchor="start">OAH / FLOWCHART</text>
<text x="40" y="88" class="title" text-anchor="start">Impact · fresh inputs</text>
<rect x="40" y="784" width="464" height="232" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" data-group-id="ranked" fill-opacity=".02" stroke-opacity=".12"/>
<text x="56" y="808" class="zone-label" text-anchor="start">Ranked results</text>
<path d="M 440,244 L 440,292" data-edge-id="e1" data-from="change" data-to="fresh" data-label="" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<path d="M 440,500 L 440,832" data-edge-id="e2" data-from="fresh" data-to="pinR" data-label="yes" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<path d="M 168,396 L 128,396 Q 120,396 120,404 L 120,580" data-edge-id="e3" data-from="fresh" data-to="refresh" data-label="no" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<path d="M 200,700 L 200,832" data-edge-id="e4" data-from="refresh" data-to="pinR" data-label="" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<path d="M 712,396 L 760,396 Q 768,396 768,404 L 768,580" data-edge-id="e5" data-from="fresh" data-to="stale" data-label="--no-refresh, or inputs keep moving" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<path d="M 696,880 L 696,944 Q 696,952 688,952 L 488,952" data-edge-id="e6" data-from="dflt" data-to="pinR" data-label="" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<rect x="448" y="721" width="40" height="20" rx="2" fill="#f5f5f5"/>
<text x="468" y="736" class="arrow-label" text-anchor="middle">YES</text>
<rect x="60" y="517" width="52" height="20" rx="2" fill="#f5f5f5"/>
<text x="86" y="532" class="arrow-label" text-anchor="middle">NO</text>
<rect x="688" y="517" width="72" height="20" rx="2" fill="#f5f5f5"/>
<text x="724" y="532" class="arrow-label" text-anchor="middle">A STALE</text>
<g data-node-id="change" data-source-label="You change a file for example a SQL migration">
<rect x="280" y="144" width="320" height="100" rx="6" fill="#f5f5f5"/>
<rect x="280" y="144" width="320" height="100" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity=".10"/>
<g aria-hidden="true">
<rect x="296" y="160" width="44" height="16" rx="2" fill="none" stroke="#5a6580" stroke-width="1" stroke-opacity=".4"/>
<text x="318" y="171" class="tag" text-anchor="middle">INPUT</text>
<g transform="translate(520,156)" color="#4f5d75"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4" /> <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" /></g></g>
</g>
<text x="296" y="202" class="node" text-anchor="start">You change a file</text>
<text x="296" y="222" class="sub" text-anchor="start">for example a SQL migration</text>
</g>
<g data-node-id="fresh" data-source-label="Worktree map fresh? HEAD, index, dirty files, ledgers, config, tool">
<polygon points="440,292 712,396 440,500 168,396" fill="#f5f5f5"/>
<polygon points="440,292 712,396 440,500 168,396" fill="#bf4520" fill-opacity=".08" stroke="#bf4520" stroke-width="1.2"/>
<g aria-hidden="true">
<rect x="400" y="328" width="44" height="16" rx="2" fill="none" stroke="#bf4520" stroke-width="1" stroke-opacity=".4"/>
<text x="422" y="339" class="tag" text-anchor="middle">CHECK</text>
</g>
<text x="440" text-anchor="middle" y="372" class="node">Worktree map fresh?</text>
<text x="440" text-anchor="middle" y="392" class="sub">HEAD, index, dirty files,</text>
<text x="440" text-anchor="middle" y="410" class="sub">ledgers, config, tool</text>
</g>
<g data-node-id="refresh" data-source-label="Refresh incrementally when possible rebuild otherwise">
<rect x="40" y="580" width="320" height="120" rx="6" fill="#f5f5f5"/>
<rect x="40" y="580" width="320" height="120" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<g aria-hidden="true">
<rect x="56" y="596" width="52" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-width="1" stroke-opacity=".4"/>
<text x="82" y="607" class="tag" text-anchor="middle">REFRESH</text>
</g>
<text x="56" y="638" class="node" text-anchor="start">Refresh incrementally</text>
<text x="56" y="658" class="sub" text-anchor="start">when possible</text>
<text x="56" y="676" class="sub" text-anchor="start">rebuild otherwise</text>
</g>
<g data-node-id="stale" data-source-label="OAH_IMPACT_STALE never used silently">
<rect x="552" y="580" width="288" height="100" rx="6" fill="#f5f5f5"/>
<rect x="552" y="580" width="288" height="100" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<g aria-hidden="true">
<rect x="568" y="596" width="44" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-width="1" stroke-opacity=".4"/>
<text x="590" y="607" class="tag" text-anchor="middle">STALE</text>
</g>
<text x="568" y="638" class="node" text-anchor="start">OAH_IMPACT_STALE</text>
<text x="568" y="658" class="sub" text-anchor="start">never used silently</text>
</g>
<g data-node-id="dflt" data-source-label="Default-branch map fetched read-only, --offline or a failed fetch is labelled stale">
<rect x="552" y="760" width="288" height="120" rx="6" fill="#f5f5f5"/>
<rect x="552" y="760" width="288" height="120" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity=".05"/>
<g aria-hidden="true">
<rect x="568" y="776" width="36" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-width="1" stroke-opacity=".4"/>
<text x="586" y="787" class="tag" text-anchor="middle">BASE</text>
</g>
<text x="568" y="818" class="node" text-anchor="start">Default-branch map</text>
<text x="568" y="838" class="sub" text-anchor="start">fetched read-only, --offline or a</text>
<text x="568" y="856" class="sub" text-anchor="start">failed fetch is labelled stale</text>
</g>
<g data-node-id="pinR" data-source-label="pin: a gate EXPECT names it, or a gate CHECK or workflow, manifest or config command hashes or greps it" data-parent="ranked">
<rect x="64" y="832" width="424" height="136" rx="6" fill="#f5f5f5"/>
<rect x="64" y="832" width="424" height="136" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity=".05"/>
<g aria-hidden="true">
<rect x="80" y="848" width="52" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-width="1" stroke-opacity=".4"/>
<text x="106" y="859" class="tag" text-anchor="middle">BINDING</text>
</g>
<text x="80" text-anchor="start" y="890" class="node">pin:</text>
<text x="80" text-anchor="start" y="910" class="sub">a gate EXPECT names it, or a gate CHECK</text>
<text x="80" text-anchor="start" y="928" class="sub">or workflow, manifest or config command</text>
<text x="80" text-anchor="start" y="946" class="sub">hashes or greps it</text>
</g>
<text x="40" y="1068" class="zone-label" text-anchor="start">TRANSITION KEYS</text>
<rect x="40" y="1087" width="28" height="20" rx="2" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
<text x="54" y="1101" class="label" text-anchor="middle">A</text>
<text x="80" y="1101" class="prose" text-anchor="start">--no-refresh, or inputs keep moving</text>
<text x="56" y="1136" class="prose" text-anchor="start">The pin result continues into the ranked results in the next figure.</text>
<line x1="40" y1="1164" x2="840" y2="1164" stroke="#2d3142" stroke-opacity=".12"/>
<text x="40" y="1192" class="zone-label" text-anchor="start">KEY</text>
<rect x="112" y="1182" width="24" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="1"/>
<text x="148" y="1192" class="prose" text-anchor="start">Focus</text>
<path d="M 236,1188 h 24" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<text x="272" y="1192" class="prose" text-anchor="start">Work / evidence</text>
<path d="M 412,1188 h 24" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<text x="448" y="1192" class="prose" text-anchor="start">Optional / return</text>
</svg>
