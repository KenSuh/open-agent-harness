<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 1104" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-impact-freshness-light-title concepts-impact-freshness-light-desc" data-source-diagram="3" id="concepts-impact-freshness-light-root">
<title id="concepts-impact-freshness-light-title">Impact · fresh inputs</title>
<desc id="concepts-impact-freshness-light-desc">A file change checks map freshness, refreshes incrementally or rebuilds when needed, reports stale instead of silently using it when refresh is disabled or inputs move, and combines the default-branch map at pin results.</desc>
<defs>
      <style>#concepts-impact-freshness-light-root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; }
      #concepts-impact-freshness-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-impact-freshness-light-root .title { font-size: 28px; font-weight: 600; }
      #concepts-impact-freshness-light-root .group { font-size: 14px; font-weight: 600; }
      #concepts-impact-freshness-light-root .node { font-size: 12px; font-weight: 600; }
      #concepts-impact-freshness-light-root .label { font-size: 12px; font-weight: 400; }
      #concepts-impact-freshness-light-root .arrow-label { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 400; }
      @media print {
#concepts-impact-freshness-light-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="concepts-impact-freshness-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e7781"/></marker>
<marker id="concepts-impact-freshness-light-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a7f37"/></marker>
<marker id="concepts-impact-freshness-light-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
</defs>
<rect x="0" y="0" width="880" height="1104" rx="0" fill="#ffffff"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#1f2328">Impact · fresh inputs</text>
<g data-container-id="ranked">
<rect x="24" y="744" width="488" height="192" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="40" y="768" class="group" text-anchor="start" fill="#424a53">Ranked results</text>
</g>
<line x1="440" y1="168" x2="440" y2="216" data-edge-id="e1" data-from="change" data-to="fresh" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<line x1="440" y1="408" x2="440" y2="784" data-edge-id="e2" data-from="fresh" data-to="pinR" data-label="yes" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<path d="M 180,312 L 128,312 Q 120,312 120,320 L 120,496" data-edge-id="e3" data-from="fresh" data-to="refresh" data-label="no" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<line x1="216" y1="592" x2="216" y2="784" data-edge-id="e4" data-from="refresh" data-to="pinR" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<path d="M 700,312 L 712,312 Q 720,312 720,320 L 720,496" data-edge-id="e5" data-from="fresh" data-to="stale" data-label="--no-refresh, or inputs keep moving" fill="none" stroke="#6e7781" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<path d="M 684,776 L 684,864 Q 684,872 676,872 L 496,872" data-edge-id="e6" data-from="dflt" data-to="pinR" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-impact-freshness-light-arrow)"/>
<rect x="448" y="624" width="48" height="20" rx="2" fill="#ffffff"/>
<text x="472.0" y="638" class="arrow-label" text-anchor="middle" fill="#424a53">YES</text>
<rect x="128" y="412" width="64" height="20" rx="2" fill="#ffffff"/>
<text x="160.0" y="426" class="arrow-label" text-anchor="middle" fill="#424a53">NO</text>
<rect x="728" y="412" width="104" height="20" rx="2" fill="#ffffff"/>
<text x="780.0" y="426" class="arrow-label" text-anchor="middle" fill="#424a53">1. STALE</text>
<g data-node-id="change" data-source-label="You change a file
for example a SQL migration">
<rect x="240" y="104" width="400" height="64" rx="20" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="440.0" y="130.0" class="node" text-anchor="middle" fill="#1f2328">You change a file</text>
<text x="440.0" y="150.0" class="label" text-anchor="middle" fill="#424a53">for example a SQL migration</text>
</g>
<g data-node-id="fresh" data-source-label="Worktree map fresh?
HEAD, index, dirty files, ledgers, config, tool">
<polygon points="440.0,216 700,312.0 440.0,408 180,312.0" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="440.0" y="296.0" class="node" text-anchor="middle" fill="#1f2328">Worktree map fresh?</text>
<text x="440.0" y="316.0" class="label" text-anchor="middle" fill="#424a53">HEAD, index, dirty files, ledgers,</text>
<text x="440.0" y="336.0" class="label" text-anchor="middle" fill="#424a53">config, tool</text>
</g>
<g data-node-id="refresh" data-source-label="Refresh incrementally when possible
rebuild otherwise">
<rect x="40" y="496" width="352" height="96" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="216.0" y="538.0" class="node" text-anchor="middle" fill="#1f2328">Refresh incrementally when possible</text>
<text x="216.0" y="558.0" class="label" text-anchor="middle" fill="#424a53">rebuild otherwise</text>
</g>
<g data-node-id="stale" data-source-label="OAH_IMPACT_STALE
never used silently">
<rect x="488" y="496" width="352" height="96" rx="20" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="664.0" y="538.0" class="node" text-anchor="middle" fill="#1f2328">OAH_IMPACT_STALE</text>
<text x="664.0" y="558.0" class="label" text-anchor="middle" fill="#424a53">never used silently</text>
</g>
<g data-node-id="dflt" data-source-label="Default-branch map
fetched read-only, --offline or a failed fetch is labelled stale">
<rect x="528" y="664" width="312" height="112" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="684.0" y="704.0" class="node" text-anchor="middle" fill="#1f2328">Default-branch map</text>
<text x="684.0" y="724.0" class="label" text-anchor="middle" fill="#424a53">fetched read-only, --offline or a</text>
<text x="684.0" y="744.0" class="label" text-anchor="middle" fill="#424a53">failed fetch is labelled stale</text>
</g>
<g data-node-id="pinR" data-parent="ranked" data-source-label="pin: a gate EXPECT names it, or a gate CHECK
or workflow, manifest or config command hashes or greps it">
<rect x="40" y="784" width="456" height="128" rx="6" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1"/>
<text x="268.0" y="832.0" class="node" text-anchor="middle" fill="#1a7f37">pin: a gate EXPECT names it, or a gate CHECK</text>
<text x="268.0" y="852.0" class="label" text-anchor="middle" fill="#424a53">or workflow, manifest or config command hashes or greps</text>
<text x="268.0" y="872.0" class="label" text-anchor="middle" fill="#424a53">it</text>
</g>
<text x="40" y="988" class="group" text-anchor="start" fill="#424a53">Transition keys</text>
<text x="40" y="1016" class="label" text-anchor="start" fill="#424a53">1 · --no-refresh, or inputs keep moving</text>
<line x1="40" y1="1044" x2="840" y2="1044" stroke="#d0d7de"/>
<text x="40" y="1072" class="label" text-anchor="start" fill="#424a53">pin continues in the ranked-results figure. Dashed: stale-input path.</text>
</svg>
