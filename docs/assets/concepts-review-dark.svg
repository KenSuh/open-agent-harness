<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 948" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-review-dark-title concepts-review-dark-desc" data-diagram-type="Flowchart" data-size="fit" id="concepts-review-dark-root">
<title id="concepts-review-dark-title">Review, correct and review again</title>
<desc id="concepts-review-dark-desc">Codex reviews a read-only snapshot, converges on approval or only P2/P3 findings, corrects P0/P1 findings before your inspection, commit and bind, and stops for your decision if a corrected kind repeats or the design must change.</desc>
<defs>
      <style>#concepts-review-dark-root { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; color: #f5f5f5; }
      #concepts-review-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-review-dark-root text { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f5f5f5; }
      #concepts-review-dark-root .title { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; }
      #concepts-review-dark-root .node { font-size: 16px; font-weight: 600; }
      #concepts-review-dark-root .sub { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #bfc0c0; }
      #concepts-review-dark-root .technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
      #concepts-review-dark-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #bfc0c0; }
      #concepts-review-dark-root .prose { font-size: 12px; font-weight: 400; fill: #bfc0c0; }
      #concepts-review-dark-root .zone-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 500; fill: #bfc0c0; }
      #concepts-review-dark-root .arrow-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #bfc0c0; }
      #concepts-review-dark-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #bfc0c0; }
      #concepts-review-dark-root .ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #f5f5f5; opacity: .06; }
      @media print {
#concepts-review-dark-root .diagram-container { overflow-x: visible; }
}</style>
<pattern id="concepts-review-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity=".10"/></pattern>
<marker id="concepts-review-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
<marker id="concepts-review-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
<marker id="concepts-review-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
</defs>
<rect width="880" height="948" fill="#2d3142"/>
<rect width="880" height="948" fill="url(#concepts-review-dark-dots)" opacity=".55"/>
<text x="40" y="48" class="tag" text-anchor="start">OAH / FLOWCHART</text>
<text x="40" y="88" class="title" text-anchor="start">Review, correct and review again</text>
