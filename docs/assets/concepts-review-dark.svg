<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 824" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-review-dark-title concepts-review-dark-desc" data-source-diagram="4" id="concepts-review-dark-root">
<title id="concepts-review-dark-title">Review, correct and review again</title>
<desc id="concepts-review-dark-desc">Codex reviews a read-only snapshot, converges on approval or only P2/P3 findings, corrects P0/P1 findings before your inspection, commit and bind, and stops for your decision if a corrected kind repeats or the design must change.</desc>
<defs>
      <style>#concepts-review-dark-root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
      #concepts-review-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-review-dark-root .title { font-size: 28px; font-weight: 600; }
      #concepts-review-dark-root .group { font-size: 14px; font-weight: 600; }
      #concepts-review-dark-root .node { font-size: 12px; font-weight: 600; }
      #concepts-review-dark-root .label { font-size: 12px; font-weight: 400; }
      #concepts-review-dark-root .arrow-label { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 400; }
      @media print {
#concepts-review-dark-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="concepts-review-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b949e"/></marker>
<marker id="concepts-review-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3fb950"/></marker>
<marker id="concepts-review-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/></marker>
</defs>
<rect x="0" y="0" width="880" height="824" rx="0" fill="#0d1117"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#f0f6fc">Review, correct and review again</text>
<line x1="400" y1="144" x2="560" y2="144" data-edge-id="e1" data-from="R" data-to="V" data-label="approve, or only P2/P3" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-review-dark-arrow)"/>
<line x1="240" y1="184" x2="240" y2="336" data-edge-id="e2" data-from="R" data-to="F" data-label="P0/P1 findings" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-review-dark-arrow)"/>
<line x1="240" y1="400" x2="240" y2="496" data-edge-id="e3" data-from="F" data-to="B" data-label="" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-review-dark-arrow)"/>
<path d="M 80,536 L 48,536 Q 40,536 40,528 L 40,160 Q 40,152 48,152 L 80,152" data-edge-id="e4" data-from="B" data-to="R" data-label="" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-review-dark-arrow)"/>
<path d="M 400,168 L 440,168 Q 448,168 448,176 L 448,376 Q 448,384 456,384 L 488,384" data-edge-id="e5" data-from="R" data-to="D" data-label="repeats a corrected kind,
or needs a design change" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-review-dark-arrow)"/>
<rect x="420" y="116" width="120" height="20" rx="2" fill="#0d1117"/>
<text x="480.0" y="130" class="arrow-label" text-anchor="middle" fill="#c9d1d9">1. APPROVE</text>
<rect x="248" y="248" width="96" height="20" rx="2" fill="#0d1117"/>
<text x="296.0" y="262" class="arrow-label" text-anchor="middle" fill="#c9d1d9">2. P0/P1</text>
<rect x="456" y="248" width="112" height="20" rx="2" fill="#0d1117"/>
<text x="512.0" y="262" class="arrow-label" text-anchor="middle" fill="#c9d1d9">3. DECISION</text>
<g data-node-id="R" data-source-label="oah review
Codex, read-only snapshot">
<rect x="80" y="120" width="320" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
<text x="240.0" y="146.0" class="node" text-anchor="middle" fill="#3fb950">oah review</text>
<text x="240.0" y="166.0" class="label" text-anchor="middle" fill="#c9d1d9">Codex, read-only snapshot</text>
</g>
<g data-node-id="F" data-source-label="oah fix
Codex corrects">
<rect x="80" y="336" width="320" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
<text x="240.0" y="362.0" class="node" text-anchor="middle" fill="#3fb950">oah fix</text>
<text x="240.0" y="382.0" class="label" text-anchor="middle" fill="#c9d1d9">Codex corrects</text>
</g>
<g data-node-id="B" data-source-label="you inspect and commit,
then oah fix --bind">
<rect x="80" y="496" width="320" height="80" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="240.0" y="530.0" class="node" text-anchor="middle" fill="#f0f6fc">you inspect and commit,</text>
<text x="240.0" y="550.0" class="label" text-anchor="middle" fill="#c9d1d9">then oah fix --bind</text>
</g>
<g data-node-id="V" data-source-label="converged">
<rect x="560" y="120" width="240" height="64" rx="20" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="680.0" y="156.0" class="node" text-anchor="middle" fill="#f0f6fc">converged</text>
</g>
<g data-node-id="D" data-source-label="stops and asks you
OAH_REVIEW_NEEDS_DECISION">
<rect x="488" y="336" width="352" height="96" rx="20" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="664.0" y="378.0" class="node" text-anchor="middle" fill="#f0f6fc">stops and asks you</text>
<text x="664.0" y="398.0" class="label" text-anchor="middle" fill="#c9d1d9">OAH_REVIEW_NEEDS_DECISION</text>
</g>
<text x="40" y="640" class="group" text-anchor="start" fill="#c9d1d9">Transition keys</text>
<text x="40" y="668" class="label" text-anchor="start" fill="#c9d1d9">1 · approve, or only P2/P3</text>
<text x="40" y="696" class="label" text-anchor="start" fill="#c9d1d9">2 · P0/P1 findings</text>
<text x="40" y="724" class="label" text-anchor="start" fill="#c9d1d9">3 · repeats a corrected kind,</text>
<text x="64" y="744" class="label" text-anchor="start" fill="#c9d1d9">or needs a design change</text>
<line x1="40" y1="764" x2="840" y2="764" stroke="#30363d"/>
<text x="40" y="792" class="label" text-anchor="start" fill="#c9d1d9">Each correction returns to review after you inspect, commit and bind it.</text>
</svg>
