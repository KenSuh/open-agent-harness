<text x="416" y="582" class="ghost" text-anchor="end">03</text>
</g>
<text x="96" y="602" class="node" text-anchor="start">you inspect and commit, then</text><text x="96" y="622" class="node" text-anchor="start">oah fix --bind</text></g>
