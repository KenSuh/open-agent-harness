<text x="40" y="796" class="zone-label" text-anchor="start">전이 조건</text>
<rect x="40" y="815" width="28" height="20" rx="2" fill="#2d3142" stroke="#bfc0c0" stroke-width="1"/>
<text x="54" y="829" class="label" text-anchor="middle">01</text>
<text x="80" y="829" class="prose" text-anchor="start">oah start, 또는 oah start --packet</text>
<rect x="40" y="847" width="28" height="20" rx="2" fill="#2d3142" stroke="#bfc0c0" stroke-width="1"/>
<text x="54" y="861" class="label" text-anchor="middle">02</text>
<text x="80" y="861" class="prose" text-anchor="start">oah renew, oah start --packet(올린 Revision), oah log</text>
<rect x="40" y="879" width="28" height="20" rx="2" fill="#2d3142" stroke="#bfc0c0" stroke-width="1"/>
<text x="54" y="893" class="label" text-anchor="middle">03</text>
<text x="80" y="893" class="prose" text-anchor="start">TTL 경과, 기본 4시간</text>
<rect x="40" y="911" width="28" height="20" rx="2" fill="#2d3142" stroke="#bfc0c0" stroke-width="1"/>
<text x="54" y="925" class="label" text-anchor="middle">04</text>
<text x="80" y="925" class="prose" text-anchor="start">oah release --reason</text>
<rect x="40" y="943" width="28" height="20" rx="2" fill="#2d3142" stroke="#bfc0c0" stroke-width="1"/>
<text x="54" y="957" class="label" text-anchor="middle">05</text>
<text x="80" y="957" class="prose" text-anchor="start">oah release --reason</text>
<rect x="40" y="975" width="28" height="20" rx="2" fill="#2d3142" stroke="#bfc0c0" stroke-width="1"/>
<text x="54" y="989" class="label" text-anchor="middle">06</text>
<text x="80" y="989" class="prose" text-anchor="start">다음 oah start가 정리</text>
<text x="56" y="1032" class="prose" text-anchor="start">oah status는 읽기만 한다. 각 리스를 active 또는 STALE로 보여 준다.</text>
<text x="56" y="1076" class="prose" text-anchor="start">start는 겹치면 OAH_LEASE_CONFLICT, 내 작업이면 OAH_LEASE_EXISTS로 거절된다.</text>
<text x="56" y="1120" class="prose" text-anchor="start">STALE 리스의 renew는 OAH_LEASE_EXPIRED로 거절된다.</text>
<text x="56" y="1164" class="prose" text-anchor="start">다른 에이전트의 리스 release에는 --force가 필요하다(없으면 OAH_LEASE_NOT_YOURS).</text>
<line x1="40" y1="1228" x2="840" y2="1228" stroke="#f5f5f5" stroke-opacity=".12"/>
