<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 1308" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-leases-lifecycle-ko-dark-title concepts-leases-lifecycle-ko-dark-desc" data-diagram-type="State machine" data-size="fit" id="concepts-leases-lifecycle-ko-dark-root">
<title id="concepts-leases-lifecycle-ko-dark-title">리스 · 활성, 만료, 해제</title>
<desc id="concepts-leases-lifecycle-ko-dark-desc">start로 활성 리스가 생기고 갱신과 로그는 활성 상태를 유지하며 TTL이 지나면 만료되고 두 상태 모두 해제할 수 있으며 다음 start가 만료 리스를 정리하되 명시된 거절 규칙이 적용된다.</desc>
<defs>
      <style>#concepts-leases-lifecycle-ko-dark-root { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: #f5f5f5; }
      #concepts-leases-lifecycle-ko-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-leases-lifecycle-ko-dark-root text { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; fill: #f5f5f5; }
      #concepts-leases-lifecycle-ko-dark-root .title { font-family: "Instrument Serif", "Noto Serif KR", "Batang", serif; font-size: 28px; font-weight: 400; }
      #concepts-leases-lifecycle-ko-dark-root .node { font-size: 16px; font-weight: 600; }
      #concepts-leases-lifecycle-ko-dark-root .sub { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #bfc0c0; }
      #concepts-leases-lifecycle-ko-dark-root .technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
      #concepts-leases-lifecycle-ko-dark-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #bfc0c0; }
      #concepts-leases-lifecycle-ko-dark-root .prose { font-size: 12px; font-weight: 400; fill: #bfc0c0; }
      #concepts-leases-lifecycle-ko-dark-root .zone-label { font-size: 12px; font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-weight: 500; fill: #bfc0c0; }
      #concepts-leases-lifecycle-ko-dark-root .arrow-label { font-size: 12px; font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-weight: 500; fill: #bfc0c0; }
      #concepts-leases-lifecycle-ko-dark-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #bfc0c0; }
      #concepts-leases-lifecycle-ko-dark-root .ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #f5f5f5; opacity: .06; }
      @media print {
#concepts-leases-lifecycle-ko-dark-root .diagram-container { overflow-x: visible; }
}</style>
