<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 540 964" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="desktop-start-light-title desktop-start-light-desc" data-diagram-type="Process" data-size="fit" id="desktop-start-light-root">
<title id="desktop-start-light-title">Start in OAH Desktop</title>
<desc id="desktop-start-light-desc">Check the available agents in Agents, then use + Open… to choose a Git worktree. In Team Workflow, you choose an agent for each stage and sync the rules. When you need them, manage skills in Explore and Installed, or set up Project Wiki, Impact Map and optional Jev in Team Workflow → Project Tools. Coding happens in each agent’s own tool; optional guided design uses Claude Code on macOS with the Python source CLI.</desc>
<defs>
      <style>#desktop-start-light-root { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; color: #2d3142; }
      #desktop-start-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #desktop-start-light-root text { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #2d3142; }
      #desktop-start-light-root .title { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; }
      #desktop-start-light-root .node { font-size: 16px; font-weight: 600; }
      #desktop-start-light-root .sub { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #desktop-start-light-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #4f5d75; }
      #desktop-start-light-root .prose { font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #desktop-start-light-root .zone-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 500; fill: #4f5d75; }
      #desktop-start-light-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #4f5d75; }
      @media print {
#desktop-start-light-root .diagram-container { overflow-x: visible; }
}</style>
<pattern id="desktop-start-light-dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity=".10"/></pattern>
<marker id="desktop-start-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
</defs>
<rect width="540" height="964" fill="#f5f5f5"/>
<rect width="540" height="964" fill="url(#desktop-start-light-dots)" opacity=".55"/>
<text x="40" y="48" class="tag" text-anchor="start">OAH DESKTOP / PROCESS</text>
<text x="40" y="88" class="title" text-anchor="start">Start in OAH Desktop</text>
<g data-node-id="outside" data-source-label="OUTSIDE THE APP Code with the agents you assigned Work in each agent’s own tool, guided by the synced rules. Optional guided design runs in Claude Code on macOS with the Python source CLI.">
<rect x="40" y="704" width="460" height="136" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
<text x="56" y="732" class="zone-label" text-anchor="start">OUTSIDE THE APP</text>
<text x="56" y="756" class="node" text-anchor="start">Code with the agents you assigned</text>
<text x="56" y="780" class="prose" text-anchor="start">Work in each agent’s own tool, guided by the synced rules.</text>
<text x="56" y="798" class="prose" text-anchor="start">Optional guided design runs in Claude Code on macOS</text>
<text x="56" y="816" class="prose" text-anchor="start">with the Python source CLI.</text>
</g>
<path d="M 256,192 L 284,192" data-edge-id="d1" data-from="agents" data-to="open" data-label="" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#desktop-start-light-arrow)"/>
<path d="M 392,260 L 392,272 Q 392,280 384,280 L 156,280 Q 148,280 148,288 L 148,300" data-edge-id="d2" data-from="open" data-to="roles" data-label="" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#desktop-start-light-arrow)"/>
<path d="M 256,372 L 284,372" data-edge-id="d3" data-from="roles" data-to="rules" data-label="" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#desktop-start-light-arrow)"/>
<path d="M 356,448 L 356,464 Q 356,472 348,472 L 156,472 Q 148,472 148,480 L 148,496" data-edge-id="d4" data-from="rules" data-to="skills" data-label="" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#desktop-start-light-arrow)"/>
<path d="M 428,448 L 428,496" data-edge-id="d5" data-from="rules" data-to="tools" data-label="" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#desktop-start-light-arrow)"/>
<g data-node-id="agents" data-source-label="Agents Check the agents See what OAH found. Install or sign in, then choose Rescan agents.">
<rect x="40" y="128" width="216" height="132" rx="6" fill="#f5f5f5"/>
<rect x="40" y="128" width="216" height="132" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<text x="56" y="156" class="label" text-anchor="start">Agents</text>
<text x="56" y="180" class="node" text-anchor="start">Check the agents</text>
<text x="56" y="200" class="sub" text-anchor="start">See what OAH found.</text>
<text x="56" y="218" class="sub" text-anchor="start">Install or sign in, then</text>
<text x="56" y="236" class="sub" text-anchor="start">choose Rescan agents.</text>
</g>
<g data-node-id="open" data-source-label="+ Open… Open a Git worktree Choose a Git worktree. Team Workflow, Installed and Project Tools use it.">
<rect x="284" y="128" width="216" height="132" rx="6" fill="#f5f5f5"/>
<rect x="284" y="128" width="216" height="132" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<text x="300" y="156" class="label" text-anchor="start">+ Open…</text>
<text x="300" y="180" class="node" text-anchor="start">Open a Git worktree</text>
<text x="300" y="200" class="sub" text-anchor="start">Choose a Git worktree.</text>
<text x="300" y="218" class="sub" text-anchor="start">Team Workflow, Installed</text>
<text x="300" y="236" class="sub" text-anchor="start">and Project Tools use it.</text>
</g>
<g data-node-id="roles" data-source-label="Team Workflow Assign each stage Plan &amp; Clarify, Write Code, Code Review, Fix Issues: you pick the Agent on each card.">
<rect x="40" y="300" width="216" height="148" rx="6" fill="#f5f5f5"/>
<rect x="40" y="300" width="216" height="148" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity=".08"/>
<text x="56" y="328" class="label" text-anchor="start">Team Workflow</text>
<text x="56" y="352" class="node" text-anchor="start">Assign each stage</text>
<text x="56" y="372" class="sub" text-anchor="start">Plan &amp; Clarify,</text>
<text x="56" y="390" class="sub" text-anchor="start">Write Code, Code Review,</text>
<text x="56" y="408" class="sub" text-anchor="start">Fix Issues: you pick the</text>
<text x="56" y="426" class="sub" text-anchor="start">Agent on each card.</text>
</g>
<g data-node-id="rules" data-source-label="Rules Sync the rules If it is not in sync, choose Sync now. Review the AGENTS.md change before you commit it.">
<rect x="284" y="300" width="216" height="148" rx="6" fill="#f5f5f5"/>
<rect x="284" y="300" width="216" height="148" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<text x="300" y="328" class="label" text-anchor="start">Rules</text>
<text x="300" y="352" class="node" text-anchor="start">Sync the rules</text>
<text x="300" y="372" class="sub" text-anchor="start">If it is not in sync,</text>
<text x="300" y="390" class="sub" text-anchor="start">choose Sync now. Review</text>
<text x="300" y="408" class="sub" text-anchor="start">the AGENTS.md change</text>
<text x="300" y="426" class="sub" text-anchor="start">before you commit it.</text>
</g>
<g data-node-id="skills" data-source-label="Explore · Installed Manage skills Review a skill folder, then Confirm install. Installed lists copies and checks for updates.">
<rect x="40" y="496" width="216" height="168" rx="6" fill="#f5f5f5"/>
<rect x="40" y="496" width="216" height="168" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<text x="56" y="524" class="label" text-anchor="start">Explore ·</text>
<text x="56" y="542" class="label" text-anchor="start">Installed</text>
<text x="56" y="566" class="node" text-anchor="start">Manage skills</text>
<text x="56" y="586" class="sub" text-anchor="start">Review a skill folder,</text>
<text x="56" y="604" class="sub" text-anchor="start">then Confirm install.</text>
<text x="56" y="622" class="sub" text-anchor="start">Installed lists copies</text>
<text x="56" y="640" class="sub" text-anchor="start">and checks for updates.</text>
</g>
<g data-node-id="tools" data-source-label="Team Workflow → Project Tools Wiki, map and Jev Set up Project Wiki and build Impact Map here. Jev stays off until you turn it on and approve.">
<rect x="284" y="496" width="216" height="168" rx="6" fill="#f5f5f5"/>
<rect x="284" y="496" width="216" height="168" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
<text x="300" y="524" class="label" text-anchor="start">Team Workflow →</text>
<text x="300" y="542" class="label" text-anchor="start">Project Tools</text>
<text x="300" y="566" class="node" text-anchor="start">Wiki, map and Jev</text>
<text x="300" y="586" class="sub" text-anchor="start">Set up Project Wiki and</text>
<text x="300" y="604" class="sub" text-anchor="start">build Impact Map here.</text>
<text x="300" y="622" class="sub" text-anchor="start">Jev stays off until you</text>
<text x="300" y="640" class="sub" text-anchor="start">turn it on and approve.</text>
</g>
<line x1="40" y1="872" x2="500" y2="872" stroke="#2d3142" stroke-opacity=".12"/>
<rect x="40" y="890" width="24" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity=".08"/>
<text x="76" y="900" class="prose" text-anchor="start">You assign roles</text>
<path d="M 260,896 h 24" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#desktop-start-light-arrow)"/>
<text x="296" y="900" class="prose" text-anchor="start">Setup order</text>
<path d="M 40,920 h 24" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#desktop-start-light-arrow)"/>
<text x="76" y="924" class="prose" text-anchor="start">When you need it</text>
<rect x="260" y="914" width="24" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
<text x="296" y="924" class="prose" text-anchor="start">Outside the app</text>
</svg>
