<text x="422" y="351" class="tag" text-anchor="middle">CHECK</text>
</g>
<text x="440" y="384" class="node" text-anchor="middle">워크트리 지도가 최신인가?</text>
<text x="440" y="404" class="sub" text-anchor="middle">HEAD, 인덱스, 수정 파일, 원장, 설정, 도구</text>
</g>
<g data-node-id="refresh" data-source-label="가능하면 증분 갱신 그렇지 않으면 전체 재생성">
