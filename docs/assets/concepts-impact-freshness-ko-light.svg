</g>
<text x="568" y="842" class="node" text-anchor="start">기본 브랜치 지도</text>
<text x="568" y="862" class="sub" text-anchor="start">읽기 전용으로 가져옴, --offline이나</text>
<text x="568" y="880" class="sub" text-anchor="start">가져오기 실패는 stale로 표시</text>
</g>
<g data-node-id="pinR" data-source-label="pin: 게이트 EXPECT가 이름을 말하거나, 게이트 CHECK 또는 workflow, manifest, config 명령이 해시하거나 grep함" data-parent="ranked">
