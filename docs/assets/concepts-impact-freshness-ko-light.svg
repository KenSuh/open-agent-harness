<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 1104" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-impact-freshness-ko-light-title concepts-impact-freshness-ko-light-desc" data-source-diagram="3" id="concepts-impact-freshness-ko-light-root">
<title id="concepts-impact-freshness-ko-light-title">영향 지도 · 최신 입력</title>
<desc id="concepts-impact-freshness-ko-light-desc">파일 변경 뒤 지도의 최신 여부를 확인하고 필요하면 증분 갱신 또는 재생성하며 갱신을 끄거나 입력이 계속 바뀌면 몰래 쓰지 않고 stale을 알리고 기본 브랜치 지도와 pin 결과에서 합쳐진다.</desc>
<defs>
      <style>#concepts-impact-freshness-ko-light-root { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; }
      #concepts-impact-freshness-ko-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-impact-freshness-ko-light-root .title { font-size: 28px; font-weight: 600; }
      #concepts-impact-freshness-ko-light-root .group { font-size: 14px; font-weight: 600; }
      #concepts-impact-freshness-ko-light-root .node { font-size: 12px; font-weight: 600; }
      #concepts-impact-freshness-ko-light-root .label { font-size: 12px; font-weight: 400; }
      #concepts-impact-freshness-ko-light-root .arrow-label { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
      @media print {
#concepts-impact-freshness-ko-light-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="concepts-impact-freshness-ko-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e7781"/></marker>
<marker id="concepts-impact-freshness-ko-light-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a7f37"/></marker>
<marker id="concepts-impact-freshness-ko-light-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
</defs>
<rect x="0" y="0" width="880" height="1104" rx="0" fill="#ffffff"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#1f2328">영향 지도 · 최신 입력</text>
<g data-container-id="ranked">
<rect x="24" y="744" width="488" height="192" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="40" y="768" class="group" text-anchor="start" fill="#424a53">순위가 매겨진 결과</text>
</g>
<line x1="440" y1="168" x2="440" y2="216" data-edge-id="e1" data-from="change" data-to="fresh" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-impact-freshness-ko-light-arrow)"/>
<line x1="440" y1="408" x2="440" y2="784" data-edge-id="e2" data-from="fresh" data-to="pinR" data-label="예" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-impact-freshness-ko-light-arrow)"/>
<path d="M 180,312 L 128,312 Q 120,312 120,320 L 120,496" data-edge-id="e3" data-from="fresh" data-to="refresh" data-label="아니오" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-impact-freshness-ko-light-arrow)"/>
<line x1="216" y1="592" x2="216" y2="784" data-edge-id="e4" data-from="refresh" data-to="pinR" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-impact-freshness-ko-light-arrow)"/>
<path d="M 700,312 L 712,312 Q 720,312 720,320 L 720,496" data-edge-id="e5" data-from="fresh" data-to="stale" data-label="--no-refresh, 또는 입력이 계속 바뀜" fill="none" stroke="#6e7781" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#concepts-impact-freshness-ko-light-arrow)"/>
<path d="M 684,776 L 684,864 Q 684,872 676,872 L 496,872" data-edge-id="e6" data-from="dflt" data-to="pinR" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#concepts-impact-freshness-ko-light-arrow)"/>
<rect x="448" y="624" width="48" height="20" rx="2" fill="#ffffff"/>
<text x="472.0" y="638" class="arrow-label" text-anchor="middle" fill="#424a53">예</text>
<rect x="128" y="412" width="64" height="20" rx="2" fill="#ffffff"/>
<text x="160.0" y="426" class="arrow-label" text-anchor="middle" fill="#424a53">아니오</text>
<rect x="728" y="412" width="104" height="20" rx="2" fill="#ffffff"/>
<text x="780.0" y="426" class="arrow-label" text-anchor="middle" fill="#424a53">1. STALE</text>
<g data-node-id="change" data-source-label="파일을 바꿈
예: SQL 마이그레이션">
<rect x="240" y="104" width="400" height="64" rx="20" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="440.0" y="130.0" class="node" text-anchor="middle" fill="#1f2328">파일을 바꿈</text>
<text x="440.0" y="150.0" class="label" text-anchor="middle" fill="#424a53">예: SQL 마이그레이션</text>
</g>
<g data-node-id="fresh" data-source-label="워크트리 지도가 최신인가?
HEAD, 인덱스, 수정 파일, 원장, 설정, 도구">
<polygon points="440.0,216 700,312.0 440.0,408 180,312.0" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="440.0" y="306.0" class="node" text-anchor="middle" fill="#1f2328">워크트리 지도가 최신인가?</text>
<text x="440.0" y="326.0" class="label" text-anchor="middle" fill="#424a53">HEAD, 인덱스, 수정 파일, 원장, 설정, 도구</text>
</g>
<g data-node-id="refresh" data-source-label="가능하면 증분 갱신
그렇지 않으면 전체 재생성">
<rect x="40" y="496" width="352" height="96" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="216.0" y="538.0" class="node" text-anchor="middle" fill="#1f2328">가능하면 증분 갱신</text>
<text x="216.0" y="558.0" class="label" text-anchor="middle" fill="#424a53">그렇지 않으면 전체 재생성</text>
</g>
<g data-node-id="stale" data-source-label="OAH_IMPACT_STALE
몰래 쓰지 않음">
<rect x="488" y="496" width="352" height="96" rx="20" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="664.0" y="538.0" class="node" text-anchor="middle" fill="#1f2328">OAH_IMPACT_STALE</text>
<text x="664.0" y="558.0" class="label" text-anchor="middle" fill="#424a53">몰래 쓰지 않음</text>
</g>
<g data-node-id="dflt" data-source-label="기본 브랜치 지도
읽기 전용으로 가져옴, --offline이나 가져오기 실패는 stale로 표시">
<rect x="528" y="664" width="312" height="112" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="684.0" y="704.0" class="node" text-anchor="middle" fill="#1f2328">기본 브랜치 지도</text>
<text x="684.0" y="724.0" class="label" text-anchor="middle" fill="#424a53">읽기 전용으로 가져옴, --offline이나</text>
<text x="684.0" y="744.0" class="label" text-anchor="middle" fill="#424a53">가져오기 실패는 stale로 표시</text>
</g>
<g data-node-id="pinR" data-parent="ranked" data-source-label="pin: 게이트 EXPECT가 이름을 말하거나, 게이트 CHECK
또는 workflow, manifest, config 명령이 해시하거나 grep함">
<rect x="40" y="784" width="456" height="128" rx="6" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1"/>
<text x="268.0" y="842.0" class="node" text-anchor="middle" fill="#1a7f37">pin: 게이트 EXPECT가 이름을 말하거나, 게이트 CHECK</text>
<text x="268.0" y="862.0" class="label" text-anchor="middle" fill="#424a53">또는 workflow, manifest, config 명령이 해시하거나 grep함</text>
</g>
<text x="40" y="988" class="group" text-anchor="start" fill="#424a53">전이 조건</text>
<text x="40" y="1016" class="label" text-anchor="start" fill="#424a53">1 · --no-refresh, 또는 입력이 계속 바뀜</text>
<line x1="40" y1="1044" x2="840" y2="1044" stroke="#d0d7de"/>
<text x="40" y="1072" class="label" text-anchor="start" fill="#424a53">pin은 다음 순위 결과 그림으로 이어진다. 점선은 오래된 입력 경로다.</text>
</svg>
