<path d="M 168,408 L 128,408 Q 120,408 120,416 L 120,592" data-edge-id="e3" data-from="fresh" data-to="refresh" data-label="아니오" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#concepts-impact-freshness-ko-light-arrow)"/>
<path d="M 200,720 L 200,856" data-edge-id="e4" data-from="refresh" data-to="pinR" data-label="" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#concepts-impact-freshness-ko-light-arrow)"/>
