<text x="568" y="670" class="sub" text-anchor="start">몰래 쓰지 않음</text>
</g>
<g data-node-id="dflt" data-source-label="기본 브랜치 지도 읽기 전용으로 가져옴, --offline이나 가져오기 실패는 stale로 표시">
<rect x="552" y="784" width="288" height="164" rx="6" fill="#f5f5f5"/>
<rect x="552" y="784" width="288" height="164" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity=".05"/>
