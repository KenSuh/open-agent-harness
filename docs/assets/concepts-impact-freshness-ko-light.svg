<g transform="translate(520,156)" color="#4f5d75"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4" /> <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" /></g></g>
</g>
<text x="296" y="202" class="node" text-anchor="start">파일을 바꿈</text>
<text x="296" y="222" class="sub" text-anchor="start">예: SQL 마이그레이션</text>
</g>
<g data-node-id="fresh" data-source-label="워크트리 지도가 최신인가? HEAD, 인덱스, 수정 파일, 원장, 설정, 도구">
<polygon points="440,304 712,408 440,512 168,408" fill="#f5f5f5"/>
<polygon points="440,304 712,408 440,512 168,408" fill="#bf4520" fill-opacity=".08" stroke="#bf4520" stroke-width="1.2"/>
