<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 1268" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-impact-freshness-ko-light-title concepts-impact-freshness-ko-light-desc" data-diagram-type="Flowchart" data-size="fit" id="concepts-impact-freshness-ko-light-root">
<title id="concepts-impact-freshness-ko-light-title">영향 지도 · 최신 입력</title>
<desc id="concepts-impact-freshness-ko-light-desc">파일 변경 뒤 지도의 최신 여부를 확인하고 필요하면 증분 갱신 또는 재생성하며 갱신을 끄거나 입력이 계속 바뀌면 몰래 쓰지 않고 stale을 알리고 기본 브랜치 지도와 pin 결과에서 합쳐진다.</desc>
<defs>
      <style>#concepts-impact-freshness-ko-light-root { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: #2d3142; }
      #concepts-impact-freshness-ko-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-impact-freshness-ko-light-root text { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; fill: #2d3142; }
      #concepts-impact-freshness-ko-light-root .title { font-family: "Instrument Serif", "Noto Serif KR", "AppleMyungjo", "Batang", "Noto Serif CJK KR", serif; font-size: 28px; font-weight: 400; }
      #concepts-impact-freshness-ko-light-root .node { font-size: 16px; font-weight: 600; }
      #concepts-impact-freshness-ko-light-root .sub { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #concepts-impact-freshness-ko-light-root .technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
      #concepts-impact-freshness-ko-light-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #4f5d75; }
      #concepts-impact-freshness-ko-light-root .prose { font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #concepts-impact-freshness-ko-light-root .zone-label { font-size: 12px; font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-weight: 500; fill: #4f5d75; }
      #concepts-impact-freshness-ko-light-root .arrow-label { font-size: 12px; font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-weight: 500; fill: #4f5d75; }
      #concepts-impact-freshness-ko-light-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #4f5d75; }
      #concepts-impact-freshness-ko-light-root .ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #2d3142; opacity: .06; }
      @media print {
#concepts-impact-freshness-ko-light-root .diagram-container { overflow-x: visible; }
}</style>
<pattern id="concepts-impact-freshness-ko-light-dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity=".10"/></pattern>
<marker id="concepts-impact-freshness-ko-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="concepts-impact-freshness-ko-light-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="concepts-impact-freshness-ko-light-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="880" height="1268" fill="#f5f5f5"/>
<rect width="880" height="1268" fill="url(#concepts-impact-freshness-ko-light-dots)" opacity=".55"/>
