<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepare and implement</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #ffffff; color: #1f2328; padding: 2rem; }
.frame { max-width: 720px; width: 100%; min-width: 0; margin: auto; }
.diagram-container { width: 100%; overflow-x: auto; }
h1 { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 28px; font-weight: 600; margin-bottom: 1rem; }
.eyebrow { font-size: 12px; color: #424a53; margin-bottom: .5rem; }
svg { width: 100%; min-width: 720px; display: block; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.title { font-size: 28px; font-weight: 600; }
.group { font-size: 14px; font-weight: 600; }
.node { font-size: 12px; font-weight: 600; }
.label { font-size: 12px; font-weight: 400; }
.mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; }
.arrow-label { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 400; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
<body>
<!-- Adapted from diagram-design 3eb03b8, MIT, Copyright (c) 2025 Cathryn Lavery.
     See ../../../THIRD_PARTY_NOTICES.md and style-guide.md. Static, offline, fit preset. -->
<div class="frame">
<p class="eyebrow">Sequence · oah</p>
<h1>Prepare and implement</h1>
<div class="diagram-container">
<svg viewBox="0 0 720 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-start-light-title loop-start-light-desc">
<title id="loop-start-light-title">Prepare and implement</title>
<desc id="loop-start-light-desc">You describe and claim the task, oah routes it to Claude Code, and you record the implementation evidence before review.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#6e7781"/>
</marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#1a7f37"/>
</marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#0969da"/>
</marker>
</defs>
<rect x="0" y="0" width="720" height="504" rx="0" fill="#ffffff"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#1f2328">Prepare and implement</text>
<line x1="100" y1="144" x2="100" y2="420" stroke="#6e7781" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="300" y1="144" x2="300" y2="420" stroke="#6e7781" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="620" y1="144" x2="620" y2="420" stroke="#6e7781" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="100" y1="200" x2="300" y2="200" stroke="#6e7781" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="174.0" y="172" width="52" height="20" rx="2" fill="#ffffff"/>
<text x="200.0" y="187" class="arrow-label" text-anchor="middle" fill="#424a53">1. TASK</text>
<line x1="300" y1="240" x2="100" y2="240" stroke="#6e7781" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="172.0" y="212" width="56" height="20" rx="2" fill="#ffffff"/>
<text x="200.0" y="227" class="arrow-label" text-anchor="middle" fill="#424a53">2. ROUTE</text>
<line x1="100" y1="280" x2="300" y2="280" stroke="#6e7781" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="172.0" y="252" width="56" height="20" rx="2" fill="#ffffff"/>
<text x="200.0" y="267" class="arrow-label" text-anchor="middle" fill="#424a53">3. START</text>
<line x1="300" y1="320" x2="620" y2="320" stroke="#6e7781" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="432.0" y="292" width="56" height="20" rx="2" fill="#ffffff"/>
<text x="460.0" y="307" class="arrow-label" text-anchor="middle" fill="#424a53">4. BUILD</text>
<line x1="620" y1="360" x2="100" y2="360" stroke="#6e7781" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="334.0" y="332" width="52" height="20" rx="2" fill="#ffffff"/>
<text x="360.0" y="347" class="arrow-label" text-anchor="middle" fill="#424a53">5. CODE</text>
<line x1="100" y1="400" x2="300" y2="400" stroke="#6e7781" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="164.0" y="372" width="72" height="20" rx="2" fill="#ffffff"/>
<text x="200.0" y="387" class="arrow-label" text-anchor="middle" fill="#424a53">6. EVIDENCE</text>
<rect x="40" y="96" width="120" height="48" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="100.0" y="124.0" class="node" text-anchor="middle" fill="#1f2328">You</text>
<rect x="240" y="96" width="120" height="48" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="300.0" y="124.0" class="node" text-anchor="middle" fill="#1f2328">oah</text>
<rect x="560" y="96" width="120" height="48" rx="6" fill="#f6f8fa" stroke="#9a6700" stroke-width="1"/>
<text x="620.0" y="124.0" class="node" text-anchor="middle" fill="#9a6700">Claude Code</text>
<line x1="40" y1="444" x2="680" y2="444" stroke="#d0d7de" stroke-width="1"/>
<text x="40" y="468" class="label" text-anchor="start" fill="#424a53">Solid: request. Dashed: return. The table below gives each command.</text>
</svg>
</div>
</div>
</body>
</html>
