<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impact · ranked results</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #ffffff; color: #1f2328; padding: 2rem; }
.frame { max-width: 880px; width: 100%; min-width: 0; margin: auto; }
.diagram-container { width: 100%; overflow-x: auto; }
h1 { font-size: 28px; font-weight: 600; margin-bottom: 1rem; }
.eyebrow { font-size: 12px; color: #424a53; margin-bottom: .5rem; }
svg { width: 100%; min-width: 880px; display: block; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.title { font-size: 28px; font-weight: 600; }
.group { font-size: 14px; font-weight: 600; }
.node { font-size: 12px; font-weight: 600; }
.label { font-size: 12px; font-weight: 400; }
.arrow-label { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 400; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
<body>
<!-- Adapted from diagram-design 3eb03b8, MIT, Copyright (c) 2025 Cathryn Lavery.

<div class="frame">
<p class="eyebrow">Flowchart · oah</p>
<h1>Impact · ranked results</h1>
<div class="diagram-container">
<svg viewBox="0 0 880 852" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-impact-ranked-light-title concepts-impact-ranked-light-desc" data-source-diagram="3">
<title id="concepts-impact-ranked-light-title">Impact · ranked results</title>
<desc id="concepts-impact-ranked-light-desc">Ranked impact results run from pin through exec and link to mention, with pin and exec identifying the exact gates and commands to rerun and the rerun lines shown with changed-since.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e7781"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a7f37"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
</defs>
<rect x="0" y="0" width="880" height="852" rx="0" fill="#ffffff"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#1f2328">Impact · ranked results</text>
<g data-container-id="ranked">
<rect x="40" y="104" width="464" height="664" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="56" y="128" class="group" text-anchor="start" fill="#424a53">Ranked results</text>
</g>
<line x1="272" y1="272" x2="272" y2="328" data-edge-id="e7" data-from="pinR" data-to="execR" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="272" y1="412" x2="272" y2="468" data-edge-id="e8" data-from="execR" data-to="linkR" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="272" y1="580" x2="272" y2="648" data-edge-id="e9" data-from="linkR" data-to="mentionR" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 488,208 L 696,208 Q 704,208 704,216 L 704,328" data-edge-id="e10" data-from="pinR" data-to="rerun" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="488" y1="368" x2="568" y2="368" data-edge-id="e11" data-from="execR" data-to="rerun" data-label="" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#arrow)"/>
<g data-node-id="pinR" data-parent="ranked" data-source-label="pin: a gate EXPECT names it, or a gate CHECK
or workflow, manifest or config command hashes or greps it">
<rect x="56" y="144" width="432" height="128" rx="6" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1"/>
<text x="272.0" y="192.0" class="node" text-anchor="middle" fill="#1a7f37">pin: a gate EXPECT names it, or a gate CHECK</text>
<text x="272.0" y="212.0" class="label" text-anchor="middle" fill="#424a53">or workflow, manifest or config command hashes or</text>
<text x="272.0" y="232.0" class="label" text-anchor="middle" fill="#424a53">greps it</text>
</g>
<g data-node-id="execR" data-parent="ranked" data-source-label="exec: a gate CHECK or such a command runs it">
<rect x="56" y="328" width="432" height="84" rx="6" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1"/>
<text x="272.0" y="374.0" class="node" text-anchor="middle" fill="#1a7f37">exec: a gate CHECK or such a command runs it</text>
</g>
<g data-node-id="linkR" data-parent="ranked" data-source-label="link: its full path is named in code, tests, workflows,

<rect x="56" y="468" width="432" height="112" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="272.0" y="498.0" class="node" text-anchor="middle" fill="#1f2328">link: its full path is named in code, tests,</text>
<text x="272.0" y="518.0" class="node" text-anchor="middle" fill="#1f2328">workflows,</text>
<text x="272.0" y="538.0" class="label" text-anchor="middle" fill="#424a53">wiki or a gate CHECK, migrations that define a SQL</text>
<text x="272.0" y="558.0" class="label" text-anchor="middle" fill="#424a53">object</text>
</g>
<g data-node-id="mentionR" data-parent="ranked" data-source-label="mention: file name or stem match, co-change,
graph neighbour">
<rect x="56" y="648" width="432" height="80" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="272.0" y="682.0" class="node" text-anchor="middle" fill="#1f2328">mention: file name or stem match, co-change,</text>
<text x="272.0" y="702.0" class="label" text-anchor="middle" fill="#424a53">graph neighbour</text>
</g>
<g data-node-id="rerun" data-source-label="Exact gates and commands to re-run
re-run lines with --changed-since">
<rect x="568" y="328" width="272" height="128" rx="20" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="704.0" y="366.0" class="node" text-anchor="middle" fill="#1f2328">Exact gates and commands to</text>
<text x="704.0" y="386.0" class="node" text-anchor="middle" fill="#1f2328">re-run</text>
<text x="704.0" y="406.0" class="label" text-anchor="middle" fill="#424a53">re-run lines with</text>
<text x="704.0" y="426.0" class="label" text-anchor="middle" fill="#424a53">--changed-since</text>
</g>
<line x1="40" y1="792" x2="840" y2="792" stroke="#d0d7de"/>
<text x="40" y="820" class="label" text-anchor="start" fill="#424a53">pin is the same result reached by the freshness and default-branch paths.</text>
</svg>

</div>
