<!DOCTYPE html>

<title>The task loop</title>
<style>
* { box-sizing: border-box; }
body { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f5f5; color: #2d3142; margin: 0; padding: 24px; }
.frame { max-width: 1232px; width: 100%; min-width: 0; margin: auto; }
.diagram-container { width: 100%; overflow-x: auto; }
h1 { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; }
svg { width: 100%; min-width: 1232px; display: block; }
text { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #2d3142; }
.title { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; }
.node { font-size: 16px; font-weight: 600; }
.sub { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #4f5d75; }
.technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
.label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #4f5d75; }
.prose { font-size: 12px; font-weight: 400; fill: #4f5d75; }
.zone-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 500; fill: #4f5d75; }
.arrow-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #4f5d75; }
.tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #4f5d75; }
.ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #2d3142; opacity: .06; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
