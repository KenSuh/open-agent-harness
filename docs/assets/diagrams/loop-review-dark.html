<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review, correct and land</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0d1117; color: #f0f6fc; padding: 2rem; }
.frame { max-width: 840px; width: 100%; min-width: 0; margin: auto; }
.diagram-container { width: 100%; overflow-x: auto; }
h1 { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 28px; font-weight: 600; margin-bottom: 1rem; }
.eyebrow { font-size: 12px; color: #c9d1d9; margin-bottom: .5rem; }
svg { width: 100%; min-width: 840px; display: block; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.title { font-size: 28px; font-weight: 600; }
.group { font-size: 14px; font-weight: 600; }
.node { font-size: 12px; font-weight: 600; }
.label { font-size: 12px; font-weight: 400; }
.mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; }
.arrow-label { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 400; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
<body>
<!-- Adapted from diagram-design 3eb03b8, MIT, Copyright (c) 2025 Cathryn Lavery.
     See ../../../THIRD_PARTY_NOTICES.md and style-guide.md. Static, offline, fit preset. -->
<div class="frame">
<p class="eyebrow">Sequence · oah</p>
<h1>Review, correct and land</h1>
<div class="diagram-container">
<svg viewBox="0 0 840 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-review-dark-title loop-review-dark-desc">
<title id="loop-review-dark-title">Review, correct and land</title>
<desc id="loop-review-dark-desc">Codex CLI reviews and corrects in a loop, you bind each correction and finish the task, and oah lands the reviewed commit after checks and your confirmation.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
</marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
</marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
</marker>
</defs>
<rect x="0" y="0" width="840" height="712" rx="0" fill="#0d1117"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#f0f6fc">Review, correct and land</text>
<rect x="60" y="164" width="500" height="284" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<line x1="100" y1="152" x2="100" y2="636" stroke="#8b949e" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="260" y1="152" x2="260" y2="636" stroke="#8b949e" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="500" y1="152" x2="500" y2="448" stroke="#8b949e" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="740" y1="152" x2="740" y2="636" stroke="#8b949e" stroke-width="1" stroke-dasharray="5,4"/>
<rect x="60" y="164" width="48" height="20" rx="2" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="84" y="178" class="mono" text-anchor="middle" fill="#c9d1d9">LOOP</text>
<rect x="76" y="188" width="472" height="24" rx="2" fill="#161b22"/>
<text x="80" y="204" class="label" text-anchor="start" fill="#c9d1d9">Until review converges; pause when a decision is needed.</text>
<line x1="260" y1="240" x2="500" y2="240" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="338" y="212" width="84" height="20" rx="2" fill="#0d1117"/>
<text x="380.0" y="227" class="arrow-label" text-anchor="middle" fill="#c9d1d9">7. REVIEW</text>
<line x1="500" y1="284" x2="260" y2="284" stroke="#8b949e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="330" y="256" width="100" height="20" rx="2" fill="#0d1117"/>
<text x="380.0" y="271" class="arrow-label" text-anchor="middle" fill="#c9d1d9">8. FINDINGS</text>
<line x1="260" y1="328" x2="500" y2="328" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="348" y="300" width="64" height="20" rx="2" fill="#0d1117"/>
<text x="380.0" y="315" class="arrow-label" text-anchor="middle" fill="#c9d1d9">9. FIX</text>
<line x1="500" y1="372" x2="100" y2="372" stroke="#8b949e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="262" y="344" width="76" height="20" rx="2" fill="#0d1117"/>
<text x="300.0" y="359" class="arrow-label" text-anchor="middle" fill="#c9d1d9">10. DIFF</text>
<line x1="100" y1="416" x2="260" y2="416" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="142" y="388" width="76" height="20" rx="2" fill="#0d1117"/>
<text x="180.0" y="403" class="arrow-label" text-anchor="middle" fill="#c9d1d9">11. BIND</text>
<line x1="100" y1="492" x2="260" y2="492" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="134" y="464" width="92" height="20" rx="2" fill="#0d1117"/>
<text x="180.0" y="479" class="arrow-label" text-anchor="middle" fill="#c9d1d9">12. FINISH</text>
<line x1="100" y1="536" x2="740" y2="536" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="382" y="508" width="76" height="20" rx="2" fill="#0d1117"/>
<text x="420.0" y="523" class="arrow-label" text-anchor="middle" fill="#c9d1d9">13. PUSH</text>
<line x1="100" y1="580" x2="260" y2="580" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="130" y="552" width="100" height="20" rx="2" fill="#0d1117"/>
<text x="180.0" y="567" class="arrow-label" text-anchor="middle" fill="#c9d1d9">14. CONFIRM</text>
<line x1="260" y1="624" x2="740" y2="624" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="462" y="596" width="76" height="20" rx="2" fill="#0d1117"/>
<text x="500.0" y="611" class="arrow-label" text-anchor="middle" fill="#c9d1d9">15. LAND</text>
<rect x="60" y="104" width="80" height="48" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="100.0" y="132.0" class="node" text-anchor="middle" fill="#f0f6fc">You</text>
<rect x="220" y="104" width="80" height="48" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="260.0" y="132.0" class="node" text-anchor="middle" fill="#f0f6fc">oah</text>
<rect x="440" y="104" width="120" height="48" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
<text x="500.0" y="132.0" class="node" text-anchor="middle" fill="#3fb950">Codex CLI</text>
<rect x="680" y="104" width="120" height="48" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="740.0" y="132.0" class="node" text-anchor="middle" fill="#f0f6fc">git / GitHub</text>
<line x1="40" y1="652" x2="800" y2="652" stroke="#30363d" stroke-width="1"/>
<text x="40" y="676" class="label" text-anchor="start" fill="#c9d1d9">Solid: request. Dashed: return. Every correction goes back through review.</text>
</svg>
</div>
</div>
</body>
</html>
