<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review, correct and review again</title>
<style>
* { box-sizing: border-box; }
body { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; background: #2d3142; color: #f5f5f5; margin: 0; padding: 24px; }
.frame { max-width: 880px; width: 100%; min-width: 0; margin: auto; }
.diagram-container { width: 100%; overflow-x: auto; }
h1 { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; }
svg { width: 100%; min-width: 880px; display: block; }
text { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f5f5f5; }
.title { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; }
.node { font-size: 16px; font-weight: 600; }
.sub { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #bfc0c0; }
.technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
.label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #bfc0c0; }
.prose { font-size: 12px; font-weight: 400; fill: #bfc0c0; }
.zone-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 500; fill: #bfc0c0; }
.arrow-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #bfc0c0; }
.tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #bfc0c0; }
.ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #f5f5f5; opacity: .06; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>

<main class="frame">
<div class="diagram-container">
<svg viewBox="0 0 880 948" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-review-dark-title concepts-review-dark-desc" data-diagram-type="Flowchart" data-size="fit">
<title id="concepts-review-dark-title">Review, correct and review again</title>
<desc id="concepts-review-dark-desc">Codex reviews a read-only snapshot, converges on approval or only P2/P3 findings, corrects P0/P1 findings before your inspection, commit and bind, and stops for your decision if a corrected kind repeats or the design must change.</desc>

<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
</defs>
<rect width="880" height="948" fill="#2d3142"/>
<rect width="880" height="948" fill="url(#dots)" opacity=".55"/>
<text x="40" y="48" class="tag" text-anchor="start">OAH / FLOWCHART</text>
<text x="40" y="88" class="title" text-anchor="start">Review, correct and review again</text>
