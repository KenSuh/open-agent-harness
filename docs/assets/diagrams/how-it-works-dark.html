<desc id="how-it-works-dark-desc">You set the goal, Claude Code implements it, Codex CLI reviews and corrects until the review converges, and you confirm landing after the checks, with optional TypeSafe Jev helping judge difficulty, model choice and skill order.</desc>

<line x1="162" y1="152" x2="162" y2="184" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="40" y="184" width="244" height="48" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
<text x="162.0" y="212.0" class="node" text-anchor="middle" fill="#d29922">2. Claude Code builds</text>
<rect x="40" y="264" width="244" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
<text x="162.0" y="284" class="node" text-anchor="middle" fill="#3fb950">3. Codex CLI reviews</text>
<text x="162.0" y="300" class="label" text-anchor="middle" fill="#c9d1d9">Correct, then review again</text>
<rect x="40" y="368" width="244" height="48" rx="20" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>

<text x="324" y="124" class="label" text-anchor="start" fill="#c9d1d9">Goal, files and success checks</text>
<text x="324" y="204" class="label" text-anchor="start" fill="#c9d1d9">A working first version</text>
<text x="324" y="284" class="label" text-anchor="start" fill="#c9d1d9">Repeat until review converges.</text>
<text x="324" y="308" class="label" text-anchor="start" fill="#c9d1d9">Pause when a decision is needed.</text>
<text x="324" y="388" class="label" text-anchor="start" fill="#c9d1d9">Checks first; then you confirm.</text>
