<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-land-ko-light-title architecture-land-ko-light-desc" id="architecture-land-ko-light-root">
<title id="architecture-land-ko-light-title">검토에서 반영까지</title>
<desc id="architecture-land-ko-light-desc">증거 게이트가 Codex 검토 반복으로 이어지고 검토 반복은 git 훅, pull request, CI와 연결되며, 반영은 수렴한 검토와 CI, 다시 평가한 영향을 확인한 뒤 사용자 확인을 거쳐 fast-forward push한다.</desc>
<defs>
      <style>#architecture-land-ko-light-root { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; }
      #architecture-land-ko-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-land-ko-light-root .title { font-size: 28px; font-weight: 600; }
      #architecture-land-ko-light-root .group { font-size: 14px; font-weight: 600; }
      #architecture-land-ko-light-root .node { font-size: 12px; font-weight: 600; }
      #architecture-land-ko-light-root .label { font-size: 12px; font-weight: 400; }
      #architecture-land-ko-light-root .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; }
      #architecture-land-ko-light-root .arrow-label { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
      @media print {
#architecture-land-ko-light-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="architecture-land-ko-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#6e7781"/>
</marker>
</defs>
<rect x="0" y="0" width="840" height="800" fill="#ffffff"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#1f2328">검토에서 반영까지</text>
<rect x="40" y="96" width="480" height="632" rx="8" fill="#1f2328" fill-opacity="0.02" stroke="#d0d7de" stroke-width="1"/>
<text x="56" y="116" class="node" text-anchor="start" fill="#424a53">oah</text>
<rect x="568" y="224" width="232" height="136" rx="8" fill="#1f2328" fill-opacity="0.02" stroke="#d0d7de" stroke-width="1"/>
<text x="584" y="244" class="node" text-anchor="start" fill="#424a53">직접 설치·로그인한 엔진</text>
<rect x="568" y="464" width="232" height="264" rx="8" fill="#1f2328" fill-opacity="0.02" stroke="#d0d7de" stroke-width="1"/>
<text x="584" y="484" class="node" text-anchor="start" fill="#424a53">git / GitHub</text>
<line x1="160" y1="200" x2="160" y2="280" data-from="gates" data-to="rloop" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#architecture-land-ko-light-arrow)"/>
<line x1="304" y1="304" x2="584" y2="304" data-from="rloop" data-to="codex" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#architecture-land-ko-light-arrow)"/>
<path d="M 304,368 H 676 Q 684,368 684,376 V 504" data-from="rloop" data-to="hooks" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#architecture-land-ko-light-arrow)"/>
<path d="M 240,400 V 464 Q 240,472 248,472 H 320 Q 328,472 328,480 V 560" data-from="rloop" data-to="land" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#architecture-land-ko-light-arrow)"/>
<path d="M 400,200 V 296 a 8,8 0 0,0 0,16 V 360 a 8,8 0 0,0 0,16 V 560" data-from="impact" data-to="land" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#architecture-land-ko-light-arrow)"/>
<line x1="684" y1="560" x2="684" y2="632" data-from="hooks" data-to="remote" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#architecture-land-ko-light-arrow)"/>
<line x1="584" y1="644" x2="496" y2="644" data-from="remote" data-to="land" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#architecture-land-ko-light-arrow)"/>
<line x1="496" y1="696" x2="584" y2="696" data-from="land" data-to="remote" fill="none" stroke="#6e7781" stroke-width="1" marker-end="url(#architecture-land-ko-light-arrow)"/>
<rect x="440" y="276" width="104" height="20" rx="2" fill="#ffffff"/>
<text x="492" y="291" class="arrow-label" text-anchor="middle" fill="#424a53">검토·수정</text>
<rect x="434" y="340" width="116" height="20" rx="2" fill="#ffffff"/>
<text x="492" y="355" class="arrow-label" text-anchor="middle" fill="#424a53">완료·푸시</text>
<rect x="204" y="512" width="116" height="20" rx="2" fill="#ffffff"/>
<text x="262" y="527" class="arrow-label" text-anchor="middle" fill="#424a53">HEAD 검토 수렴</text>
<rect x="504" y="616" width="72" height="20" rx="2" fill="#ffffff"/>
<text x="540" y="631" class="arrow-label" text-anchor="middle" fill="#424a53">CI / gh</text>
<rect x="508" y="668" width="64" height="20" rx="2" fill="#ffffff"/>
<text x="540" y="683" class="arrow-label" text-anchor="middle" fill="#424a53">푸시</text>
<g data-node-id="gates">
<rect x="64" y="144" width="192" height="56" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="160" y="168" class="node" text-anchor="middle" fill="#1f2328">증거 게이트</text>
<text x="160" y="188" class="label" text-anchor="middle" fill="#424a53">앞 그림에서 이어진다</text>
</g>
<g data-node-id="impact">
<rect x="304" y="144" width="192" height="56" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="400" y="168" class="node" text-anchor="middle" fill="#1f2328">영향 지도</text>
<text x="400" y="188" class="label" text-anchor="middle" fill="#424a53">기본 브랜치를 다시 평가한다</text>
</g>
<g data-node-id="rloop">
<rect x="64" y="280" width="240" height="120" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="184" y="304" class="node" text-anchor="middle" fill="#1f2328">검토 반복</text>
<text x="184" y="328" class="label" text-anchor="middle" fill="#424a53">읽기 전용 스냅샷</text>
<text x="184" y="348" class="label" text-anchor="middle" fill="#424a53">카나리와 영수증</text>
<text x="184" y="376" class="label" text-anchor="middle" fill="#424a53">검토가 수렴할 때까지</text>
</g>
<g data-node-id="codex">
<rect x="584" y="264" width="200" height="80" rx="6" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1"/>
<text x="684" y="288" class="node" text-anchor="middle" fill="#1a7f37">Codex CLI</text>
<text x="684" y="312" class="label" text-anchor="middle" fill="#424a53">검토와 수정</text>
<text x="684" y="332" class="label" text-anchor="middle" fill="#424a53">oah review / oah fix</text>
</g>
<g data-node-id="land">
<rect x="280" y="560" width="216" height="152" rx="6" fill="#f6f8fa" stroke="#0969da" stroke-width="1"/>
<text x="388" y="584" class="node" text-anchor="middle" fill="#0969da">oah land</text>
<text x="388" y="608" class="label" text-anchor="middle" fill="#424a53">--check → --merge</text>
<text x="388" y="632" class="label" text-anchor="middle" fill="#424a53">검토한 정확한 HEAD</text>
<text x="388" y="660" class="label" text-anchor="middle" fill="#424a53">사용자가 확인한 뒤 반영한다</text>
<text x="388" y="688" class="label" text-anchor="middle" fill="#424a53">fast-forward push</text>
</g>
<g data-node-id="hooks">
<rect x="584" y="504" width="200" height="56" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="684" y="528" class="node" text-anchor="middle" fill="#1f2328">로컬 git 훅</text>
<text x="684" y="548" class="label" text-anchor="middle" fill="#424a53">선택 설치 · oah finish 뒤</text>
</g>
<g data-node-id="remote">
<rect x="584" y="632" width="200" height="80" rx="6" fill="#ffffff" stroke="#6e7781" stroke-width="1"/>
<text x="684" y="656" class="node" text-anchor="middle" fill="#1f2328">Pull request와 CI</text>
<text x="684" y="680" class="label" text-anchor="middle" fill="#424a53">HEAD의 CI 결과</text>
<text x="684" y="700" class="label" text-anchor="middle" fill="#424a53">git / GitHub</text>
</g>
<line x1="40" y1="740" x2="800" y2="740" stroke="#d0d7de" stroke-width="1"/>
<text x="40" y="764" class="label" text-anchor="start" fill="#424a53">앞 그림과 같은 게이트와 영향 지도다. 사용자가 확인한 뒤 검토한 HEAD만 반영한다.</text>
</svg>
