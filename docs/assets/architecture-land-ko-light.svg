<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 1236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-land-ko-light-title architecture-land-ko-light-desc" data-diagram-type="Architecture" data-size="fit" id="architecture-land-ko-light-root">
<title id="architecture-land-ko-light-title">검토에서 반영까지</title>
<desc id="architecture-land-ko-light-desc">증거 게이트가 Codex 검토 반복으로 이어지고 검토 반복은 git 훅, pull request, CI와 연결되며, 반영은 수렴한 검토와 CI, 다시 평가한 영향을 확인한 뒤 사용자 확인을 거쳐 fast-forward push한다.</desc>
<defs>
      <style>#architecture-land-ko-light-root { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: #2d3142; }
      #architecture-land-ko-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-land-ko-light-root text { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; fill: #2d3142; }
      #architecture-land-ko-light-root .title { font-family: "Instrument Serif", "Noto Serif KR", "Batang", serif; font-size: 28px; font-weight: 400; }
      #architecture-land-ko-light-root .node { font-size: 16px; font-weight: 600; }
      #architecture-land-ko-light-root .sub { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #architecture-land-ko-light-root .technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
      #architecture-land-ko-light-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #4f5d75; }
      #architecture-land-ko-light-root .prose { font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #architecture-land-ko-light-root .zone-label { font-size: 12px; font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-weight: 500; fill: #4f5d75; }
      #architecture-land-ko-light-root .arrow-label { font-size: 12px; font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-weight: 500; fill: #4f5d75; }
      #architecture-land-ko-light-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #4f5d75; }
      #architecture-land-ko-light-root .ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #2d3142; opacity: .06; }
      @media print {
#architecture-land-ko-light-root .diagram-container { overflow-x: visible; }
}</style>
