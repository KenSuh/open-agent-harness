<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 1484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-ko-light-title how-it-works-ko-light-desc" data-diagram-type="Swimlane" data-size="fit" id="how-it-works-ko-light-root">
<title id="how-it-works-ko-light-title">말로 요청하고, 하네스와 함께 끝낸다</title>
<desc id="how-it-works-ko-light-desc">사용자가 말로 변경을 요청하면 설치된 규칙에 따라 의도·범위·리스·영향 지도와 선택형 Jev 판정을 준비하고, Claude Code가 구현하며 게이트와 위키가 증거를 남기고 Codex CLI가 검토·수정한 뒤 사용자가 질문·검토·확인하면 검사 후 반영하며, 안내형 설계 대화는 v0.4.0에 계획돼 있다.</desc>
<defs>
