<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 1388" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-build-light-title architecture-build-light-desc" data-diagram-type="Architecture" data-size="fit" id="architecture-build-light-root">
<title id="architecture-build-light-title">From task to evidence</title>
<desc id="architecture-build-light-desc">You send a packet through leases, preflight and routing to Claude Code, with recommended optional TypeSafe Jev reordering skills and judging task difficulty so the tier can change within its floor, and evidence gates linked to the impact map and wiki.</desc>
<defs>
      <style>#architecture-build-light-root { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; color: #2d3142; }
      #architecture-build-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-build-light-root text { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #2d3142; }
      #architecture-build-light-root .title { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-weight: 400; }
      #architecture-build-light-root .node { font-size: 16px; font-weight: 600; }
      #architecture-build-light-root .sub { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #architecture-build-light-root .technical { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
      #architecture-build-light-root .label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #4f5d75; }
      #architecture-build-light-root .prose { font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #architecture-build-light-root .zone-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 500; fill: #4f5d75; }
      #architecture-build-light-root .arrow-label { font-size: 12px; font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 400; fill: #4f5d75; }
      #architecture-build-light-root .tag { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 500; letter-spacing: .08em; fill: #4f5d75; }
      #architecture-build-light-root .ghost { font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 32px; font-weight: 600; fill: #2d3142; opacity: .06; }
      @media print {
#architecture-build-light-root .diagram-container { overflow-x: visible; }
}</style>
