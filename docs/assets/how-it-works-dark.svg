<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-dark-title how-it-works-dark-desc" id="how-it-works-dark-root">
<title id="how-it-works-dark-title">How oah works</title>
<desc id="how-it-works-dark-desc">You set the goal, Claude Code implements it, Codex CLI reviews and corrects until the review converges, and you confirm landing after the checks.</desc>
<defs>
      <style>#how-it-works-dark-root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
      #how-it-works-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #how-it-works-dark-root .title { font-size: 28px; font-weight: 600; }
      #how-it-works-dark-root .group { font-size: 14px; font-weight: 600; }
      #how-it-works-dark-root .node { font-size: 12px; font-weight: 600; }
      #how-it-works-dark-root .label { font-size: 12px; font-weight: 400; }
      #how-it-works-dark-root .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; }
      #how-it-works-dark-root .arrow-label { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; font-weight: 400; }
      @media print {
#how-it-works-dark-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="how-it-works-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
</marker>
<marker id="how-it-works-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
</marker>
<marker id="how-it-works-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="480" rx="0" fill="#0d1117"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#f0f6fc">How oah works</text>
<line x1="162" y1="152" x2="162" y2="184" stroke="#8b949e" stroke-width="1" marker-end="url(#how-it-works-dark-arrow)"/>
<line x1="162" y1="232" x2="162" y2="264" stroke="#8b949e" stroke-width="1" marker-end="url(#how-it-works-dark-arrow)"/>
<line x1="162" y1="328" x2="162" y2="368" stroke="#8b949e" stroke-width="1" marker-end="url(#how-it-works-dark-arrow)"/>
<rect x="40" y="104" width="244" height="48" rx="20" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="162.0" y="132.0" class="node" text-anchor="middle" fill="#f0f6fc">1. Describe the task</text>
<rect x="40" y="184" width="244" height="48" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
<text x="162.0" y="212.0" class="node" text-anchor="middle" fill="#d29922">2. Claude Code builds</text>
<rect x="40" y="264" width="244" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
<text x="162.0" y="284" class="node" text-anchor="middle" fill="#3fb950">3. Codex CLI reviews</text>
<text x="162.0" y="300" class="label" text-anchor="middle" fill="#c9d1d9">Correct, then review again</text>
<rect x="40" y="368" width="244" height="48" rx="20" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="162.0" y="396.0" class="node" text-anchor="middle" fill="#f0f6fc">4. Confirm and land</text>
<text x="324" y="124" class="label" text-anchor="start" fill="#c9d1d9">Goal, files and success checks</text>
<text x="324" y="204" class="label" text-anchor="start" fill="#c9d1d9">A working first version</text>
<text x="324" y="284" class="label" text-anchor="start" fill="#c9d1d9">Repeat until review converges.</text>
<text x="324" y="308" class="label" text-anchor="start" fill="#c9d1d9">Pause when a decision is needed.</text>
<text x="324" y="388" class="label" text-anchor="start" fill="#c9d1d9">Checks first; then you confirm.</text>
<line x1="40" y1="440" x2="600" y2="440" stroke="#30363d" stroke-width="1"/>
<text x="40" y="464" class="label" text-anchor="start" fill="#c9d1d9">Default roles. Adapt the parts to your own AI setup.</text>
</svg>
