<title id="concepts-landing-local-ko-light-title">반영 · 내 컴퓨터의 훅</title>
<desc id="concepts-landing-local-ko-light-desc">선택 설치한 로컬 훅이 위키 커밋 검사, 영향 지도 갱신, 남은 리스 확인과 gitleaks 설치 시 푸시 커밋 검사를 하며 푸시는 secrets 검사와 풀 리퀘스트로 이어지고 Claude에는 Stop과 SessionStart 훅이 있다.</desc>
