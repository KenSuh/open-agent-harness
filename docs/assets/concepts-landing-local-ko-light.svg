      #concepts-landing-local-ko-light-root .prose { font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #concepts-landing-local-ko-light-root .zone-label { font-size: 12px; font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-weight: 500; fill: #4f5d75; }
