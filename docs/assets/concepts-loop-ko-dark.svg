<title id="concepts-loop-ko-dark-title">작업의 전체 흐름</title>
<desc id="concepts-loop-ko-dark-desc">패킷이 리스, Claude 구현, 게이트와 위키 증거, Codex 리뷰를 거치며 수정 요청은 증거 단계로 돌아가고 리뷰가 수렴하면 finish 뒤 사용자 확인을 거쳐 반영된다.</desc>
