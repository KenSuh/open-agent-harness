<text x="40" y="712" class="label" text-anchor="start" fill="#424a53">6 · oah finish</text>
<text x="40" y="740" class="label" text-anchor="start" fill="#424a53">7 · 반환, 위키, 게이트, 범위 통과, 또는 허용 옵션(기록됨)</text>
<text x="40" y="768" class="label" text-anchor="start" fill="#424a53">8 · 거절, 리스는 그대로 활성</text>
<text x="40" y="796" class="label" text-anchor="start" fill="#424a53">9 · 거절, 리스는 만료</text>
<rect x="40" y="828" width="800" height="72" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="56" y="856" class="label" text-anchor="start" fill="#424a53">finish 거절 코드는 OAH_INTENT_RETURN_INVALID, OAH_WIKI_MAINTENANCE_MISSING, OAH_GATES_UNMET,</text>
<text x="56" y="876" class="label" text-anchor="start" fill="#424a53">OAH_SCOPE_EXCEEDED다.</text>
<line x1="40" y1="908" x2="840" y2="908" stroke="#d0d7de"/>
<text x="40" y="936" class="label" text-anchor="start" fill="#424a53">같은 활성·만료 상태를 이어 그렸다. 거절되면 해당 상태로 돌아간다.</text>
