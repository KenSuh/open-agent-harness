<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 1164" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-leases-finish-ko-light-title concepts-leases-finish-ko-light-desc" data-diagram-type="State machine" data-size="fit" id="concepts-leases-finish-ko-light-root">
<title id="concepts-leases-finish-ko-light-title">리스 · finish 검사</title>
<desc id="concepts-leases-finish-ko-light-desc">활성과 만료 리스는 반환, 위키, 게이트, 범위를 통과하거나 기록되는 허용 옵션으로 끝나며 거절되면 활성 또는 만료 상태를 유지하고 해당 finish 거절 코드를 알린다.</desc>
<defs>
      <style>#concepts-leases-finish-ko-light-root { font-family: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: #2d3142; }
      #concepts-leases-finish-ko-light-root .diagram-container { width: 100%; overflow-x: auto; }
