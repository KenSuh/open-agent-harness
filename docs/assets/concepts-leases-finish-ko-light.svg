<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 968" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-leases-finish-ko-light-title concepts-leases-finish-ko-light-desc" data-source-diagram="1" id="concepts-leases-finish-ko-light-root">
<title id="concepts-leases-finish-ko-light-title">리스 · finish 검사</title>
<desc id="concepts-leases-finish-ko-light-desc">활성과 만료 리스는 반환, 위키, 게이트, 범위를 통과하거나 기록되는 허용 옵션으로 끝나며 거절되면 활성 또는 만료 상태를 유지하고 해당 finish 거절 코드를 알린다.</desc>
<defs>
      <style>#concepts-leases-finish-ko-light-root { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; }
      #concepts-leases-finish-ko-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-leases-finish-ko-light-root .title { font-size: 28px; font-weight: 600; }
      #concepts-leases-finish-ko-light-root .group { font-size: 14px; font-weight: 600; }
      #concepts-leases-finish-ko-light-root .node { font-size: 12px; font-weight: 600; }
      #concepts-leases-finish-ko-light-root .label { font-size: 12px; font-weight: 400; }
      #concepts-leases-finish-ko-light-root .arrow-label { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
      @media print {
#concepts-leases-finish-ko-light-root .diagram-container { overflow-x: visible; }
}</style>
