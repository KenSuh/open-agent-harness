<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 848" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-build-ko-dark-title architecture-build-ko-dark-desc" id="architecture-build-ko-dark-root">
<title id="architecture-build-ko-dark-title">작업에서 증거까지</title>
<desc id="architecture-build-ko-dark-desc">사용자의 패킷이 리스, 사전 점검과 배정을 거쳐 Claude Code로 가며 권장 선택형 TypeSafe Jev가 스킬 순서와 작업 난이도를 판정해 최저 기준 안에서 tier를 바꿀 수 있고 증거 게이트는 영향 지도와 위키에 연결된다.</desc>
<defs>
      <style>#architecture-build-ko-dark-root { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
      #architecture-build-ko-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-build-ko-dark-root .title { font-size: 28px; font-weight: 600; }
      #architecture-build-ko-dark-root .group { font-size: 14px; font-weight: 600; }
      #architecture-build-ko-dark-root .node { font-size: 12px; font-weight: 600; }
      #architecture-build-ko-dark-root .label { font-size: 12px; font-weight: 400; }
      #architecture-build-ko-dark-root .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 8px; }
      #architecture-build-ko-dark-root .arrow-label { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
      @media print {
#architecture-build-ko-dark-root .diagram-container { overflow-x: visible; }
}</style>
