<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 1252" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concepts-routing-skills-dark-title concepts-routing-skills-dark-desc" data-source-diagram="2" id="concepts-routing-skills-dark-root">
<title id="concepts-routing-skills-dark-title">Routing · skill order and Jev</title>
<desc id="concepts-routing-skills-dark-desc">The task yields a reasoned deterministic skill list, configured and enabled reranking uses Jev only with candidates, success records used, and no candidates, disabling or errors record unused with the original order kept on error.</desc>
<defs>
      <style>#concepts-routing-skills-dark-root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
      #concepts-routing-skills-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #concepts-routing-skills-dark-root .title { font-size: 28px; font-weight: 600; }
      #concepts-routing-skills-dark-root .group { font-size: 14px; font-weight: 600; }
      #concepts-routing-skills-dark-root .node { font-size: 12px; font-weight: 600; }
      #concepts-routing-skills-dark-root .label { font-size: 12px; font-weight: 400; }
      #concepts-routing-skills-dark-root .arrow-label { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 400; }
      @media print {
#concepts-routing-skills-dark-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="concepts-routing-skills-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b949e"/></marker>
<marker id="concepts-routing-skills-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3fb950"/></marker>
<marker id="concepts-routing-skills-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/></marker>
</defs>
<rect x="0" y="0" width="880" height="1252" rx="0" fill="#0d1117"/>
<text x="40" y="64" class="title" text-anchor="start" fill="#f0f6fc">Routing · skill order and Jev</text>
<line x1="440" y1="168" x2="440" y2="208" data-edge-id="e6" data-from="task" data-to="skills" data-label="" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-routing-skills-dark-arrow)"/>
<line x1="440" y1="272" x2="440" y2="312" data-edge-id="e7" data-from="skills" data-to="ask" data-label="" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-routing-skills-dark-arrow)"/>
<path d="M 192,400 L 72,400 Q 64,400 64,408 L 64,552" data-edge-id="e8" data-from="ask" data-to="jev" data-label="yes, candidates present" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-routing-skills-dark-arrow)"/>
<path d="M 688,400 L 808,400 Q 816,400 816,408 L 816,552" data-edge-id="e9" data-from="ask" data-to="unused" data-label="yes, no candidates" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-routing-skills-dark-arrow)"/>
<path d="M 440,488 L 440,512 Q 440,520 448,520 L 552,520 Q 560,520 560,528 L 560,552" data-edge-id="e10" data-from="ask" data-to="unused" data-label="no" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-routing-skills-dark-arrow)"/>
<line x1="216" y1="680" x2="216" y2="784" data-edge-id="e11" data-from="jev" data-to="used" data-label="scoring succeeds" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-routing-skills-dark-arrow)"/>
<line x1="392" y1="616" x2="488" y2="616" data-edge-id="e12" data-from="jev" data-to="unused" data-label="error, original order kept" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-routing-skills-dark-arrow)"/>
<path d="M 216,832 L 216,944 Q 216,952 224,952 L 244,952" data-edge-id="e13" data-from="used" data-to="brief" data-label="" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-routing-skills-dark-arrow)"/>
<path d="M 664,696 L 664,944 Q 664,952 656,952 L 636,952" data-edge-id="e14" data-from="unused" data-to="brief" data-label="" fill="none" stroke="#8b949e" stroke-width="1" marker-end="url(#concepts-routing-skills-dark-arrow)"/>
<rect x="72" y="456" width="120" height="20" rx="2" fill="#0d1117"/>
<text x="132.0" y="470" class="arrow-label" text-anchor="middle" fill="#c9d1d9">1. CANDIDATES</text>
<rect x="696" y="456" width="112" height="20" rx="2" fill="#0d1117"/>
<text x="752.0" y="470" class="arrow-label" text-anchor="middle" fill="#c9d1d9">2. NO CAND.</text>
<rect x="448" y="492" width="88" height="20" rx="2" fill="#0d1117"/>
<text x="492.0" y="506" class="arrow-label" text-anchor="middle" fill="#c9d1d9">3. NO</text>
<rect x="224" y="724" width="96" height="20" rx="2" fill="#0d1117"/>
<text x="272.0" y="738" class="arrow-label" text-anchor="middle" fill="#c9d1d9">4. SUCCESS</text>
<rect x="400" y="588" width="80" height="20" rx="2" fill="#0d1117"/>
<text x="440.0" y="602" class="arrow-label" text-anchor="middle" fill="#c9d1d9">5. ERROR</text>
<g data-node-id="task" data-source-label="Task: stage, kind and Scope paths
axes you give explicitly win">
<rect x="244" y="104" width="392" height="64" rx="20" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="440.0" y="130.0" class="node" text-anchor="middle" fill="#f0f6fc">Task: stage, kind and Scope paths</text>
<text x="440.0" y="150.0" class="label" text-anchor="middle" fill="#c9d1d9">axes you give explicitly win</text>
</g>
<g data-node-id="skills" data-source-label="Deterministic skill list
with a reason for each skill">
<rect x="244" y="208" width="392" height="64" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="440.0" y="234.0" class="node" text-anchor="middle" fill="#f0f6fc">Deterministic skill list</text>
<text x="440.0" y="254.0" class="label" text-anchor="middle" fill="#c9d1d9">with a reason for each skill</text>
</g>
<g data-node-id="ask" data-source-label="Not --no-rerank, enabled by you,
provider set AND key present?">
<polygon points="440.0,312 688,400.0 440.0,488 192,400.0" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="440.0" y="394.0" class="node" text-anchor="middle" fill="#f0f6fc">Not --no-rerank, enabled by you,</text>
<text x="440.0" y="414.0" class="label" text-anchor="middle" fill="#c9d1d9">provider set AND key present?</text>
</g>
<g data-node-id="jev" data-source-label="TypeSafe Jev provider
re-orders only, never adds or drops
judges difficulty from the Intent and Scope paths">
<rect x="40" y="552" width="352" height="128" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="1"/>
<text x="216.0" y="590.0" class="node" text-anchor="middle" fill="#a371f7">TypeSafe Jev provider</text>
<text x="216.0" y="610.0" class="label" text-anchor="middle" fill="#c9d1d9">re-orders only, never adds or drops</text>
<text x="216.0" y="630.0" class="label" text-anchor="middle" fill="#c9d1d9">judges difficulty from the Intent and Scope</text>
<text x="216.0" y="650.0" class="label" text-anchor="middle" fill="#c9d1d9">paths</text>
</g>
<g data-node-id="used" data-source-label="rerank=used">
<rect x="40" y="784" width="352" height="48" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="216.0" y="812.0" class="node" text-anchor="middle" fill="#f0f6fc">rerank=used</text>
</g>
<g data-node-id="unused" data-source-label="rerank=unused(reason)
disabled-by-brief, not-enabled, not-configured,
unknown-provider, no key, no-candidates, error:CODE">
<rect x="488" y="552" width="352" height="144" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="664.0" y="588.0" class="node" text-anchor="middle" fill="#f0f6fc">rerank=unused(reason)</text>
<text x="664.0" y="608.0" class="label" text-anchor="middle" fill="#c9d1d9">disabled-by-brief, not-enabled,</text>
<text x="664.0" y="628.0" class="label" text-anchor="middle" fill="#c9d1d9">not-configured,</text>
<text x="664.0" y="648.0" class="label" text-anchor="middle" fill="#c9d1d9">unknown-provider, no key, no-candidates,</text>
<text x="664.0" y="668.0" class="label" text-anchor="middle" fill="#c9d1d9">error:CODE</text>
</g>
<g data-node-id="brief" data-source-label="Packet plan, brief and run record">
<rect x="244" y="920" width="392" height="64" rx="20" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
<text x="440.0" y="956.0" class="node" text-anchor="middle" fill="#f0f6fc">Packet plan, brief and run record</text>
</g>
<text x="40" y="1024" class="group" text-anchor="start" fill="#c9d1d9">Transition keys</text>
<text x="40" y="1052" class="label" text-anchor="start" fill="#c9d1d9">1 · yes, candidates present</text>
<text x="40" y="1080" class="label" text-anchor="start" fill="#c9d1d9">2 · yes, no candidates</text>
<text x="40" y="1108" class="label" text-anchor="start" fill="#c9d1d9">3 · no</text>
<text x="40" y="1136" class="label" text-anchor="start" fill="#c9d1d9">4 · scoring succeeds</text>
<text x="40" y="1164" class="label" text-anchor="start" fill="#c9d1d9">5 · error, original order kept</text>
<line x1="40" y1="1192" x2="840" y2="1192" stroke="#30363d"/>
<text x="40" y="1220" class="label" text-anchor="start" fill="#c9d1d9">Jev’s difficulty judgement connects to tier selection in the preceding figure.</text>
</svg>
